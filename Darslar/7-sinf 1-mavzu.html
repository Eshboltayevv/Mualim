<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fizika nima? Tabiatni oʻrganish usullari — 7-sinf fizika elektron darsi"><meta name="theme-color" content="#0b78d1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
<meta name="color-scheme" content="light dark"><title>Fizika nima? Tabiatni oʻrganish usullari — 7-sinf</title>
<style>
:root{--bg:#eef5fb;--cd:#fff;--tx:#12263a;--mut:#53708a;--ac:#0b78d1;--ac2:#19b5c9;--ac3:#e8f3fd;--ok:#1b9e55;--no:#d93c3c;--bd:#cfe0ef;--gl:rgba(255,255,255,.62);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-t=night]{--bg:#0a1724;--cd:#132536;--tx:#e8f1fa;--mut:#8ea8c0;--ac:#4fb0ff;--ac2:#35d0cf;--ac3:#1c3448;--bd:#294258;--gl:rgba(20,34,50,.62)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.6 system-ui,sans-serif;color:var(--tx);background:
radial-gradient(700px 500px at 10% -10%,rgba(11,120,209,.18),transparent 60%),
radial-gradient(600px 460px at 100% 0%,rgba(25,181,201,.16),transparent 60%),var(--bg)}
button,select,input{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
header{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0;flex:1 1 auto}
.stat{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
.stat b{color:var(--tx)}
#tgl{border:1px solid var(--bd);background:var(--ac3);border-radius:10px;min-height:38px;padding:0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:52px;z-index:8;background:var(--bg);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;flex:none;min-height:44px;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(10px);color:var(--tx);padding:8px 16px;border-radius:12px}
nav button.on{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
main{max-width:980px;margin:0 auto;padding:4px 16px 70px}
section{display:none}section.on{display:block;animation:pop .35s}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.card{background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(11,70,120,.1)}
.hd{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;padding:12px 16px;border-radius:14px;margin-bottom:14px}
.hd .nb{background:rgba(255,255,255,.25);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex:none;font-weight:800}
.hd h2{margin:0;font-size:18px}
canvas{width:100%;max-width:640px;background:var(--ac3);border-radius:14px;display:block;margin:8px auto;touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--bd);background:var(--ac3);color:var(--tx);border-radius:12px;min-height:44px;padding:0 16px;font-weight:600}
.btn.p{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border:0}
.btn.ok{background:var(--ok)!important;color:#fff;border:0}.btn.no{background:var(--no)!important;color:#fff;border:0}
input[type=range]{flex:1;min-width:120px}
.f{background:var(--ac3);border-left:5px solid var(--ac);padding:10px 14px;border-radius:8px;font:700 18px ui-monospace,monospace;margin:8px 0}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bd);cursor:pointer}
.dots i.cur{background:var(--ac);transform:scale(1.4)}
.pr{height:7px;background:var(--bd);border-radius:5px;overflow:hidden}.pr i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.sv svg{width:100%;height:auto}.sv text{fill:var(--tx);font:13px sans-serif}
.gc{background:var(--ac3);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:left;min-height:46px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;white-space:normal}
small.m{color:var(--mut);display:block;margin-top:6px}
@media(max-width:700px){h1{font-size:15px}.hd h2{font-size:16px}.card{padding:13px}canvas{border-radius:10px}}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#vrw:fullscreen,#vrw.fs{background:var(--bg);padding:12px;overflow:auto}
#vrw.fs{position:fixed;inset:0;z-index:50}
#vrw:fullscreen canvas,#vrw.fs canvas{max-width:min(100%,110vh)}
.sv{margin-top:8px}
</style></head>
<body>
<header><h1>🔬 Fizika nima? Tabiatni oʻrganish usullari</h1>
<div class="stat"><span>⭐ <b id="hStar">0</b></span><span>🏆 <b id="hScore">0</b></span><span>⏱ <b id="hTime">00:00</b></span></div>
<button id="tgl">🌓</button></header>
<nav id="nv"></nav>
<main>
<section id="slides"></section>
<section id="sim">
 <div class="hd"><span class="nb">2</span><h2>Simulyatsiyalar</h2></div>
 <div class="row" id="sn" style="margin-bottom:10px"></div>
 <canvas id="c1" width="640" height="320"></canvas>
 <div class="row" id="simc"></div>
 <div class="f" id="so"></div><small class="m" id="sh"></small>
</section>
<section id="vr">
 <div class="hd"><span class="nb">3</span><h2>VR laboratoriya</h2></div>
 <div id="vrw"><canvas id="cvr" width="640" height="420"></canvas>
 <div class="row"><button class="btn" id="vra">⟳ Avto-aylanish: ha</button><label>Masshtab <input type="range" id="vrz" min="0.6" max="1.8" step="0.1" value="1"></label>
 <label>Ip uzunligi: <b id="vrlv">100</b> sm <input type="range" id="vrl" min="40" max="140" value="100"></label>
 <button class="btn" id="vrrs">↺ Tiklash</button><button class="btn" id="vrfs">⛶ Toʻliq ekran</button></div>
 <p class="f" id="vri">Sichqoncha yoki barmoq bilan aylantiring, asbobni bosib maʼlumot oling.</p></div>
</section>
<section id="video">
 <div class="hd"><span class="nb">4</span><h2>Video-dars: ilmiy usul bosqichlari</h2></div>
 <canvas id="cvd" width="640" height="300"></canvas>
 <p id="vdcap" class="f">Boshlash uchun ▶ tugmasini bosing</p>
 <div class="row"><button class="btn p" id="vdp">▶ Ishga tushirish</button><button class="btn" id="vds">⏸ Pauza</button><button class="btn" id="vdr">↺ Qaytadan</button>
 <label><input type="checkbox" id="vsnd"> 🔊 Ovozli sharh</label></div>
 <div class="row"><input id="vseek" type="range" min="0" max="40" step="0.1" value="0"></div>
</section>
<section id="test"></section>
<section id="games"></section>
</main>
<script>
const $=id=>document.getElementById(id);
const ST={score:0,done:{},t0:Date.now(),elapsed:0};
try{Object.assign(ST,JSON.parse(localStorage.getItem('fiz_v1')||'{}'))}catch(e){}
function saveST(){try{localStorage.setItem('fiz_v1',JSON.stringify({score:ST.score,done:ST.done,elapsed:ST.elapsed}))}catch(e){}}
function addScore(n){ST.score+=n;if(ST.score<0)ST.score=0;hud()}
function hud(){$('hScore').textContent=ST.score;$('hStar').textContent='★'.repeat(Math.min(5,Math.floor(ST.score/30)))||'0';$('hTime').textContent=fmt(ST.elapsed)}
function fmt(s){s|=0;return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(()=>{ST.elapsed=(Date.now()-ST.t0)/1000;hud();if(ST.elapsed%5<1)saveST()},1000);

/* tungi rejim */
if(localStorage.getItem('fiz_theme')=='night')document.documentElement.dataset.t='night';
$('tgl').onclick=()=>{const d=document.documentElement;d.dataset.t=d.dataset.t=='night'?'':'night';localStorage.setItem('fiz_theme',d.dataset.t)};

/* navigatsiya */
const TABS=[['slides','📑 Slaydlar'],['sim','🧪 Simulyatsiya'],['vr','🥽 VR lab'],['video','🎬 Video'],['test','📝 Test'],['games','🎮 O\'yinlar']];
TABS.forEach(([id,n],i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(id);if(i==0)b.classList.add('on');$('nv').append(b)});
function go(id){if(typeof onGo=="function")onGo(id);document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==id));[...$('nv').children].forEach((b,i)=>b.classList.toggle('on',TABS[i][0]==id))}
go('slides');

/* ========= 1) SLAYDLAR ========= */
let RT='1',LG='uz-UZ';
const R=a=>`<svg viewBox="0 0 400 150">${a.map((e,i)=>{const x=(i+.5)*400/a.length;return `<text x="${x}" y="70" text-anchor="middle" style="font-size:38px">${e[0]}<animate attributeName="y" values="70;58;70" dur="2s" begin="${i*.35}s" repeatCount="indefinite"/></text><text x="${x}" y="112" text-anchor="middle">${e[1]}</text>`}).join("")}</svg>`;
const FIG={
f1:()=>`<svg viewBox="0 0 400 150"><g transform="translate(200 68)"><circle r="12" fill="var(--ac)"><animate attributeName="r" values="12;15;12" dur="1.6s" repeatCount="indefinite"/></circle>${[0,60,120].map((r,i)=>`<g transform="rotate(${r})"><ellipse rx="95" ry="30" fill="none" stroke="var(--ac2)" stroke-width="2" opacity=".6"/><circle r="6" fill="var(--no)"><animateMotion dur="${3+i}s" repeatCount="indefinite" path="M-95,0 a95,30 0 1,0 190,0 a95,30 0 1,0 -190,0"/></circle></g>`).join("")}</g><text x="200" y="146" text-anchor="middle">Atom — tabiat sirlari</text></svg>`,
f2:()=>R([["🌧️","Yomgʻir"],["⚡","Chaqmoq"],["🌋","Vulqon"],["🌊","Toʻlqin"]]),
f3:()=>R([["🚗","Mexanik"],["🔥","Issiqlik"],["🔊","Tovush"],["💡","Yorugʻlik"],["🧲","Magnit"],["🔌","Elektr"]]),
f4:()=>`<svg viewBox="0 0 400 150"><line x1="20" y1="100" x2="380" y2="100" stroke="var(--bd)" stroke-width="4"/><text x="20" y="95" style="font-size:34px">🚗<animate attributeName="x" values="20;320;20" dur="6s" repeatCount="indefinite"/></text><text x="200" y="30" text-anchor="middle" style="font-size:20px;font-weight:700">s = v · t</text><text x="200" y="135" text-anchor="middle">yoʻl = tezlik × vaqt</text></svg>`,
f5:()=>R([["📏","metr (m)"],["⚖️","kilogramm (kg)"],["⏱️","sekund (s)"]]),
f6:()=>`<svg viewBox="0 0 400 150"><line x1="30" y1="70" x2="370" y2="70" stroke="var(--ac)" stroke-width="4"/>${[["mm","10⁻³ m"],["sm","10⁻² m"],["m","1 m"],["km","10³ m"]].map((a,i)=>`<circle cx="${60+i*95}" cy="70" r="9" fill="var(--ac2)"><animate attributeName="r" values="7;12;7" dur="2s" begin="${i*.4}s" repeatCount="indefinite"/></circle><text x="${60+i*95}" y="45" text-anchor="middle" style="font-size:18px;font-weight:700">${a[0]}</text><text x="${60+i*95}" y="108" text-anchor="middle">${a[1]}</text>`).join("")}</svg>`,
f7:()=>R([["📏","Chizgʻich"],["🌡️","Termometr"],["⏱️","Sekundomer"],["⚖️","Tarozi"],["🧪","Menzurka"]]),
f8:()=>`<svg viewBox="0 0 400 150"><rect x="30" y="80" width="340" height="36" rx="4" fill="#f3d36b" stroke="#a88"/>${Array.from({length:35},(_,i)=>`<line x1="${40+i*9.4}" y1="80" x2="${40+i*9.4}" y2="${i%5?92:102}" stroke="#333"/>`).join("")}<rect x="40" y="42" width="10" height="26" rx="5" fill="var(--ac)"><animate attributeName="width" values="10;188;188;10" dur="5s" repeatCount="indefinite"/></rect><text x="200" y="26" text-anchor="middle">Qalam uzunligini oʻlchash</text></svg>`,
f9:()=>`<svg viewBox="0 0 400 150"><rect x="60" y="14" width="18" height="100" rx="9" fill="#fff" stroke="var(--tx)"/><rect x="65" y="100" width="8" height="0" fill="var(--no)"><animate attributeName="y" values="100;30;100" dur="5s" repeatCount="indefinite"/><animate attributeName="height" values="0;70;0" dur="5s" repeatCount="indefinite"/></rect><circle cx="69" cy="122" r="14" fill="var(--no)"/><text x="110" y="50">20 °C va 30 °C orasida 5 boʻlinma</text><text x="110" y="78">C = (30 − 20) / 5 = 2 °C</text><text x="110" y="106">Xatolik: Δ = C / 2 = 1 °C</text></svg>`,
f10:()=>`<svg viewBox="0 0 400 150"><line x1="40" y1="80" x2="360" y2="80" stroke="var(--tx)"/>${[0,1,2,3,4,5,6].map(i=>`<line x1="${40+i*53}" y1="74" x2="${40+i*53}" y2="86" stroke="var(--tx)"/><text x="${40+i*53}" y="104" text-anchor="middle">${i*2}</text>`).join("")}<rect x="146" y="50" width="53" height="24" fill="var(--ac)" opacity=".4"><animate attributeName="opacity" values=".2;.7;.2" dur="2s" repeatCount="indefinite"/></rect><circle cx="173" cy="62" r="6" fill="var(--no)"/><text x="200" y="30" text-anchor="middle">Natija: 5 ± 1 (oraliq 4 … 6)</text></svg>`,
f11:()=>R([["👀","Kuzatish"],["📝","Yozib borish"],["❓","Savol"]]),
f12:()=>R([["🧪","Tajriba"],["🌡️","Oʻlchash"],["📊","Natija"]]),
f13:()=>`<svg viewBox="0 0 400 150">${["Kuzatish","Gipoteza","Tajriba","Xulosa"].map((t,i)=>`<rect x="${8+i*98}" y="52" width="88" height="38" rx="10" fill="var(--ac)"/><text x="${52+i*98}" y="76" text-anchor="middle" style="fill:#fff;font-weight:700">${t}</text>${i<3?`<text x="${99+i*98}" y="76" text-anchor="middle" style="font-size:18px">➜</text>`:""}`).join("")}<circle r="7" fill="var(--no)" cy="38"><animate attributeName="cx" values="52;150;248;346;52" dur="6s" repeatCount="indefinite"/></circle><text x="200" y="128" text-anchor="middle">Xulosa yangi savollarga olib keladi ↺</text></svg>`,
f14:()=>R([["🔭","Teleskop"],["📱","Telefon"],["🚀","Raketa"],["⚡","Elektr"]]),
f15:()=>`<svg viewBox="0 0 400 150">${[0,1,2,3,4].map(i=>`<text x="${60+i*70}" y="70" text-anchor="middle" style="font-size:40px">⭐<animate attributeName="opacity" values="1;.3;1" dur="1.5s" begin="${i*.25}s" repeatCount="indefinite"/></text>`).join("")}<text x="200" y="120" text-anchor="middle">Kuzat · Tajriba qil · Oʻlcha · Xulosa chiqar</text></svg>`};
const S=[
["Fizika nima?","<p><b>Fizika</b> — tabiat va unda sodir boʻladigan hodisalarni, moddaning xossalarini oʻrganuvchi fan. Soʻz yunoncha <i>physis</i> — «tabiat» degani.</p><p>Fizika bizga yomgʻir nega yogʻishini, samolyot nega uchishini tushuntiradi.</p>","f1"],
["Tabiat hodisalari","<p><b>Fizik hodisa</b> — jism holati oʻzgaradi, lekin modda turi oʻzgarmaydi.</p><ul><li>Yomgʻir yogʻishi, chaqmoq chaqnashi</li><li>Muz erishi, suv qaynashi</li><li>Tovush tarqalishi</li></ul>","f2"],
["Fizik hodisa turlari","<ul><li><b>Mexanik</b> — jismlar harakati</li><li><b>Issiqlik</b> — isish va sovish</li><li><b>Tovush</b> va <b>yorugʻlik</b></li><li><b>Elektr</b> va <b>magnit</b> hodisalari</li></ul>","f3"],
["Fizik kattalik","<p><b>Fizik kattalik</b> — jism yoki hodisani sonlar bilan tavsiflaydigan xossa: uzunlik <i>l</i>, massa <i>m</i>, vaqt <i>t</i>, tezlik <i>v</i>.</p><div class='f'>s = v · t</div><p>Rasmdagi mashina tekis harakatda: yoʻl = tezlik × vaqt.</p>","f4"],
["Birliklar sistemasi (SI)","<p>Kattaliklar <b>birlik</b>lar bilan oʻlchanadi. Xalqaro sistema SI: uzunlik — <b>metr</b>, massa — <b>kilogramm</b>, vaqt — <b>sekund</b>.</p>","f5"],
["Karrali birliklar","<p>1 km = 1000 m; 1 m = 100 sm; 1 sm = 10 mm.</p><p>Misol: 2,5 km = 2500 m; 350 g = 0,35 kg.</p>","f6"],
["Fizik asboblar","<p>Oʻlchash uchun asboblar: chizgʻich (uzunlik), termometr (harorat), sekundomer (vaqt), tarozi (massa), menzurka (hajm).</p>","f7"],
["Oʻlchash nima?","<p><b>Oʻlchash</b> — kattalikni oʻlchov birligi bilan solishtirib, qiymatini aniqlash.</p><p>Natija: <b>son + birlik</b>, masalan 12 sm.</p>","f8"],
["Boʻlinma qiymati","<p>Asbob shkalasidagi ikki yaqin chiziqcha orasidagi qiymat:</p><div class='f'>C = (y₂ − y₁) / n</div><p>Misol: 20 va 30 °C orasida 5 boʻlinma → C = 2 °C.</p>","f9"],
["Oʻlchash xatoligi","<p>Aniq oʻlchash mumkin emas. Xatolik taxminan boʻlinma qiymatining yarmiga teng:</p><div class='f'>Δ = C / 2</div><p>Natija: <b>x ± Δ</b>.</p>","f10"],
["Kuzatish","<p><b>Kuzatish</b> — hodisaga aralashmasdan, uni tabiiy sharoitda diqqat bilan oʻrganish (Oy fazalari, ob-havo, yulduzlar).</p>","f11"],
["Tajriba","<p><b>Tajriba</b> (eksperiment) — hodisani maxsus sharoitda, shartlarni oʻzgartirib, takror oʻrganish. Natijalar jadvalga yoziladi.</p>","f12"],
["Ilmiy usul","<ol><li>Kuzatish va savol</li><li>Gipoteza (taxmin)</li><li>Tajriba va oʻlchash</li><li>Natijani tahlil, xulosa</li></ol>","f13"],
["Fizika va texnika","<p>Fizika qonunlari texnikaning asosi: telefon, samolyot, raketa, elektr stansiyalari fizik bilimlar natijasida yaratilgan.</p>","f14"],
["Xulosa","<ul><li>Fizika — tabiat haqidagi fan</li><li>Kattaliklar birliklar bilan oʻlchanadi</li><li>Usullar: kuzatish, tajriba, oʻlchash</li></ul><p>Endi Simulyatsiya, VR, Video, Test va Oʻyinlarda bilimingizni mustahkamlang! 🚀</p>","f15"]];
let si=0;
function slide(){const[t,h,fk]=S[si],f=FIG[fk];if(!ST.done['s'+si]){ST.done['s'+si]=1;addScore(1)}
$('slides').innerHTML=`<div class="card"><div class="hd"><span class="nb">1</span><h2>${t}</h2></div>${h}${f?`<div class="sv">${f()}</div>`:''}
<div class="pr"><i style="width:${(si+1)/S.length*100}%"></i></div>
<div class="dots">${S.map((_,i)=>`<i class="${i==si?'cur':''}" data-i="${i}"></i>`).join('')}</div>
<div class="row"><button class="btn" id="pv">◀ Oldingi</button><button class="btn p" id="nx">Keyingi ▶</button><button class="btn" id="rd">🔊 O'qish</button>
<select id="rate" style="min-height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--ac3);color:var(--tx)"><option value=".8">Sekin</option><option value="1" selected>O'rtacha</option><option value="1.3">Tez</option></select><select id="lng" style="min-height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--ac3);color:var(--tx)"><option value="uz-UZ">Oʻzbek</option><option value="ru-RU">Русский</option><option value="en-US">English</option></select>
<small class="m" style="flex:1 1 100%">${si+1} / ${S.length} · ← → tugmalari bilan ham o'tish mumkin</small></div></div>`;
$('pv').onclick=()=>{if(si>0){si--;slide()}};$('nx').onclick=()=>{if(si<S.length-1){si++;slide()}else{addScore(5)}};
document.querySelectorAll('.dots i').forEach(d=>d.onclick=()=>{si=+d.dataset.i;slide()});
$('rate').value=RT;$('lng').value=LG;$('rate').onchange=e=>RT=e.target.value;$('lng').onchange=e=>LG=e.target.value;$('rd').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t+'. '+h.replace(/<[^>]+>/g,' '));u.lang=$('lng').value;u.rate=+$('rate').value;speechSynthesis.speak(u)};}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
(function() {
  'use strict';
  if (window.__EMAKTAB_TEST_HOOK_INJECTED__) return;
  window.__EMAKTAB_TEST_HOOK_INJECTED__ = true;

  try {
    if (Object.prototype.hasOwnProperty.call(window, 'localStorage')) {
      delete window.localStorage;
    }
  } catch(e) {}

  function getStudent() {
    try {
      var raw = localStorage.getItem("currentStudent") || localStorage.getItem("emaktab_student");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  var hasSubmitted = false;

  async function submitTestResults(score, total) {
    if (hasSubmitted) return;
    hasSubmitted = true;

    var student = getStudent();
    var lessonTitle = document.title || document.querySelector("h1, h2, .lesson-title")?.textContent?.trim() || "7-sinf Fizika darsi";
    lessonTitle = lessonTitle.replace(/—\s*7-sinf.*$/i, '').trim();

    var record = {
      student_id: (student && student.id) ? student.id : null,
      student_name: student ? [student.first_name, student.last_name].filter(Boolean).join(" ") : "Nomaʼlum oʻquvchi",
      phone: (student && student.phone) ? student.phone : "",
      grade: "7-sinf",
      subject: "Fizika",
      lesson_title: lessonTitle,
      score: Number(score || 0),
      total_questions: Number(total || 10),
      created_at: new Date().toISOString()
    };

    var client = (window.getSupabaseClient && window.getSupabaseClient()) || window.supabaseClient;
    if (client) {
      try {
        var res = await client.from("test_results").insert([record]);
        if (res.error) {
          console.warn("[E-Maktab] Test submission error:", res.error);
        } else {
          showBadgeInTestCard("✅ Natija serverga yuborildi");
        }
      } catch(err) {
        console.warn("[E-Maktab] Test submission failed:", err);
      }
    }
  }

  function showBadgeInTestCard(msg) {
    var card = document.querySelector("#test .card, #test, #tq, main");
    if (!card) return;
    if (document.getElementById("emaktab-sync-badge")) return;
    var badge = document.createElement("div");
    badge.id = "emaktab-sync-badge";
    badge.setAttribute("style", "margin-top:14px;padding:8px 14px;background:rgba(27,158,85,0.12);border:1px solid #1b9e55;border-radius:10px;color:#1b9e55;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;");
    badge.textContent = msg;
    card.appendChild(badge);
  }

  function checkTestContainer() {
    if (hasSubmitted) return;
    var root = document.querySelector("#test, #tq, main") || document.body;
    if (!root) return;
    var text = root.innerText || root.textContent || "";

    // Pattern 1: "Siz X savoldan Y tasiga to'g'ri javob berdingiz"
    var m1 = text.match(/(\d+)\s*savoldan\s*(\d+)\s*tasiga/i);
    if (m1) {
      var total1 = parseInt(m1[1], 10);
      var score1 = parseInt(m1[2], 10);
      submitTestResults(score1, total1);
      return;
    }

    // Pattern 2: "Natija: X / Y to'g'ri"
    var m2 = text.match(/Natija:\s*(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m2) {
      var score2 = parseInt(m2[1], 10);
      var total2 = parseInt(m2[2], 10);
      submitTestResults(score2, total2);
      return;
    }

    // Pattern 3: "X / Y to'g'ri"
    var m3 = text.match(/(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m3) {
      var score3 = parseInt(m3[1], 10);
      var total3 = parseInt(m3[2], 10);
      submitTestResults(score3, total3);
      return;
    }
  }

  var observer = new MutationObserver(function() {
    checkTestContainer();
  });

  document.addEventListener("click", function(e) {
    if (e.target && (e.target.id === "qRetry" || e.target.id === "qr" || e.target.closest("#qRetry, #qr"))) {
      hasSubmitted = false;
      var b = document.getElementById("emaktab-sync-badge");
      if (b) b.remove();
    }
  });

  function startObserver() {
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    checkTestContainer();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startObserver);
  } else {
    startObserver();
  }
})();
</script>
