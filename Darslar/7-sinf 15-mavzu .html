<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Og'irlik kuchi va og'irlik</title>
<style>
:root{--bg:#e6f3ff;--c:#0b2a45;--cd:rgba(255,255,255,.72);--p:#0b78d1;--ok:#1b9e55;--er:#d93c3c;--bd:rgba(11,120,209,.22)}
body.dark{--bg:#0a1b2c;--c:#e8f4ff;--cd:rgba(20,45,70,.72);--bd:rgba(120,190,255,.25)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--c);padding:10px;min-height:100vh;line-height:1.5}
.w{max-width:1000px;margin:auto}
.card{background:var(--cd);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(11,120,209,.15)}
h1,h2{background:linear-gradient(120deg,#0b78d1,#19b5c9);-webkit-background-clip:text;background-clip:text;color:transparent;margin:.2em 0}
h1{font-size:1.3rem}
button,select{min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--c);padding:0 14px;font:inherit;cursor:pointer}
button.on,button.pr{background:var(--p);color:#fff;border-color:var(--p)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.er{background:var(--er);color:#fff;border-color:var(--er)}
button:disabled{opacity:1;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{display:none}.sec.on{display:block}
svg{width:100%;max-height:260px;color:var(--c)}
canvas{width:100%;height:auto;border-radius:14px;background:rgba(255,255,255,.55);touch-action:none;display:block}
body.dark canvas{background:rgba(0,0,0,.3)}
.pb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;width:0;background:linear-gradient(120deg,#0b78d1,#19b5c9);transition:width .3s}
.dot{min-height:0;width:14px;height:14px;padding:0;border-radius:50%}
label{display:block;flex:1 1 200px}
input[type=range]{width:100%;height:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 button{width:100%;margin-bottom:8px;padding:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g4 button{height:64px;padding:2px;font-size:.85rem}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 14px}
#vrw:fullscreen{background:var(--bg);overflow:auto;padding:10px}
#vrw:fullscreen canvas{max-height:60vh;object-fit:contain}
.fig{margin-top:8px}
</style></head><body><div class="w">
<div class="card"><div class="row" style="justify-content:space-between"><h1>⚖ Og'irlik kuchi va og'irlik · 7-sinf</h1><button id="th">🌓 Mavzu</button></div>
<div class="row"><b id="sc"></b><span id="stars" style="color:#f5a623;font-size:1.2rem"></span><span id="tm">⏱ 0:00</span></div><div class="pb"><i id="pb"></i></div>
<div class="row" style="margin-top:8px"><button id="spk">🔊 O'qish</button><select id="rt"><option value=".7">Sekin</option><option value="1" selected>Normal</option><option value="1.4">Tez</option></select><select id="lg"><option value="uz-UZ">O'zbek</option><option value="ru-RU">Русский</option><option value="en-US">English</option></select></div></div>
<div class="card row" id="nav"></div>

<div id="s0" class="sec card on"><div id="sl"></div><div class="row"><button id="pv">‹ Orqaga</button><button id="nx" class="pr">Oldinga ›</button><b id="spg"></b></div><div id="dots" class="row" style="margin-top:10px"></div></div>

<div id="s1" class="sec card"><div class="row" id="st"></div><canvas id="cv" width="600" height="320"></canvas><p><b id="inf"></b></p><div id="cs" class="row"></div></div>

<div id="s2" class="sec"><div id="vrw" class="card"><canvas id="vr" width="640" height="360"></canvas><p style="margin:6px 0">Sichqoncha yoki barmoq bilan sahnani aylantiring.</p>
<div class="row"><label>Massa: <b id="vmo">5</b> kg<input type="range" id="vm" min="1" max="10" value="5"></label><label>Balandlik: <b id="vho">4</b> m<input type="range" id="vh" min="1" max="6" value="4"></label></div>
<div class="row" style="margin-top:8px"><select id="vp"><option value="9.8">Yer (9,8)</option><option value="1.6">Oy (1,6)</option><option value="3.7">Mars (3,7)</option><option value="24.8">Yupiter (24,8)</option></select><button id="vd" class="pr">⬇ Tushirish</button><button id="vs">👓 Stereo</button><button id="vf">⛶ To'liq ekran</button><button id="v0">↺ Ko'rinish</button></div></div></div>

<div id="s3" class="sec card"><canvas id="vc" width="600" height="320"></canvas><p id="sub" style="min-height:3em;font-weight:600"></p><input type="range" id="vk" min="0" max="40" step=".1" value="0"><div class="row"><button id="vpl" class="pr">▶ Play</button><button id="vpa">⏸ Pauza</button><button id="vre">↺ Qaytadan</button><b id="vtm"></b></div></div>

<div id="s4" class="sec card"><div id="tq"></div></div>
<div id="s5" class="sec card"><div class="row" id="gt"></div><div id="gm" style="margin-top:12px"></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
let st;try{st=JSON.parse(localStorage.getItem('gv7'))||{}}catch(e){st={}}
st.p=st.p||{};st.t=st.t||0;
const sv=()=>{try{localStorage.setItem('gv7',JSON.stringify(st))}catch(e){}},MAX=110;
const col=()=>document.body.classList.contains('dark')?'#e8f4ff':'#0b2a45';
function upd(){const s=Object.values(st.p).reduce((a,b)=>a+b,0),k=Math.round(s/MAX*5);$('#sc').textContent='Ball: '+s+'/'+MAX;$('#stars').textContent='★'.repeat(k)+'☆'.repeat(5-k);$('#pb').style.width=Math.min(100,s/MAX*100)+'%'}
function add(k,v){if((st.p[k]||0)<v){st.p[k]=v;sv();upd()}}
setInterval(()=>{st.t++;$('#tm').textContent='⏱ '+Math.floor(st.t/60)+':'+String(st.t%60).padStart(2,'0');if(st.t%5==0)sv()},1000);
document.body.classList.toggle('dark',!!st.d);
$('#th').onclick=()=>{st.d=!st.d;document.body.classList.toggle('dark',st.d);sv()};
let cur=0;
`📖 Slaydlar,🧪 Simulyatsiya,🥽 VR,🎬 Video,📝 Test,🎮 O'yinlar`.split(',').forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);$('#nav').append(b)});
function show(i){cur=i;for(let j=0;j<6;j++)$('#s'+j).classList.toggle('on',j==i);[...$('#nav').children].forEach((b,j)=>b.classList.toggle('on',j==i));if(i!=3)vp=false;try{speechSynthesis.cancel()}catch(e){}}
/* SVG */
const f=b=>`<svg viewBox="0 0 300 160"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#d93c3c"/></marker></defs>${b}</svg>`;
const T=(x,y,s,z=12,c='currentColor')=>`<text x="${x}" y="${y}" font-size="${z}" text-anchor="middle" fill="${c}">${s}</text>`;
const A=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#d93c3c" stroke-width="3" marker-end="url(#ar)"/>`;
const C=(x,y,r,l)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${l}"/>`;
const R=(x,y,w,h,l)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${l}"/>`;
const FIG={
e:()=>f(C(150,230,120,'#2a8cd9')+C(150,35,14,'#d93c3c')+A(150,52,150,100)+T(225,80,`F — og'irlik kuchi`)+T(150,150,'Yer',14,'#fff')),
g:()=>f(C(70,80,28,'#0b78d1')+C(230,80,20,'#19b5c9')+A(100,80,135,80)+A(208,80,165,80)+T(70,85,'m₁',13,'#fff')+T(230,85,'m₂',13,'#fff')+T(150,130,'F = G·m₁·m₂ / r²',14)+T(150,25,'Jismlar bir-birini tortadi')),
v:()=>[[40,15,8],[100,35,16],[160,65,24],[220,100,32]].map((p,i)=>C(p[0],p[1],8,'#d93c3c')+A(p[0],p[1]+9,p[0],p[1]+9+p[2])+T(p[0],157,['v=0','9,8 m/s','19,6 m/s','29,4 m/s'][i],10)).reduce((a,b)=>a+b,'')|0||f([[40,15,8],[100,35,16],[160,65,24],[220,100,32]].map((p,i)=>C(p[0],p[1],8,'#d93c3c')+A(p[0],p[1]+9,p[0],p[1]+9+p[2])+T(p[0],157,['v=0','9,8 m/s','19,6 m/s','29,4 m/s'][i],10)).join('')),
f:()=>f(R(60,40,180,60,'#0b78d1')+T(150,80,'F = m · g',26,'#fff')+T(150,125,`F — og'irlik kuchi (N)`,11)+T(150,142,'m — massa (kg), g ≈ 9,8 N/kg',11)),
d:()=>f(C(150,250,130,'#2a8cd9')+[[70,30,94,96],[150,20,150,100],[230,30,206,96]].map(p=>C(p[0],p[1],7,'#d93c3c')+A(p[0],p[1]+8,p[2],p[3])).join('')+T(150,150,'Yer markazi tomon',11,'#fff')+T(150,12,'Vertikal pastga',11)),
c:()=>f(R(90,30,120,70,'#19b5c9')+C(150,65,5,'#d93c3c')+A(150,65,150,140)+T(150,22,`Og'irlik markazi — kuch qo'yilgan nuqta`,11)+T(175,128,'F',14)),
p:()=>f(R(60,100,180,12,'#8a6d3b')+R(130,66,40,34,'#0b78d1')+A(150,100,150,150)+T(150,22,`P — jismning tayanchga bosimi`,12)+T(200,138,'P',14)+T(268,110,'Tayanch',10)),
df:()=>f(R(40,50,40,30,'#0b78d1')+A(60,65,60,110)+T(60,128,'F',14)+T(60,145,'jismga',10)+R(190,100,100,8,'#8a6d3b')+R(220,66,40,34,'#0b78d1')+A(240,108,240,148)+T(275,135,'P',14)+T(240,158,'tayanchga',10)+T(150,15,`F — Yer tortishi, P — tayanchga ta'sir`,11)),
b:()=>f(R(70,50,50,90,'#d93c3c')+R(180,50,50,90,'#0b78d1')+T(95,44,'F = m·g',12)+T(205,44,'P',13)+T(150,100,'=',28)+T(150,155,'Tinch holatda P = F = m·g',11)),
m:()=>f(R(20,10,125,125,'rgba(11,120,209,.25)')+R(155,10,125,125,'rgba(25,181,201,.25)')+T(82,32,'MASSA m',13)+T(82,58,'skalyar kattalik',11)+T(82,78,'birligi: kg',11)+T(82,98,'hamma joyda bir xil',11)+T(217,32,`OG'IRLIK P`,13)+T(217,58,'vektor kattalik',11)+T(217,78,'birligi: N',11)+T(217,98,`g ga bog'liq`,11)+T(150,153,'P = m · g',13)),
s:()=>f(R(125,8,50,70,'rgba(11,120,209,.2)')+`<polyline points="150,78 138,90 162,102 138,114 162,126 150,134" fill="none" stroke="currentColor" stroke-width="2"/>`+R(133,134,34,20,'#0b78d1')+T(235,50,'Dinamometr:',12)+T(235,68,`kuchni N da o'lchaydi`,11)+T(235,86,'(prujinaning cho`zilishi',10)+T(235,100,'kuchga proporsional)',10)),
vc:()=>f(C(50,90,5,'#d93c3c')+A(50,90,200,90)+T(125,75,'1 sm = 10 N',12)+`<line x1="50" y1="125" x2="90" y2="125" stroke="currentColor" stroke-width="3"/>`+T(70,145,'10 N',11)+T(150,25,`Vektor: nuqta, yo'nalish, uzunlik (kattalik)`,11)+T(250,115,'F = 15 N',12)),
pl:()=>f([['Oy',1.6],['Mars',3.7],['Yer',9.8],['Yupiter',24.8]].map((p,i)=>R(30+i*68,135-p[1]*4.8,50,p[1]*4.8,'#0b78d1')+T(55+i*68,150,p[0],11)+T(55+i*68,130-p[1]*4.8,p[1],11)).join('')),
w:()=>f(C(60,110,40,'#2a8cd9')+`<ellipse cx="60" cy="110" rx="100" ry="60" fill="none" stroke="currentColor" stroke-dasharray="4"/>`+R(150,100,20,20,'#d93c3c')+T(225,40,'Vaznsizlik: P = 0',13)+T(225,60,'Sun`iy yo`ldosh erkin tushadi',10)),
ex:()=>f(R(90,40,60,50,'#0b78d1')+T(120,70,'5 kg',14,'#fff')+A(120,90,120,135)+T(215,60,'m = 5 kg, g = 9,8',12)+T(215,82,'F = 5 · 9,8 = 49 N',13))};
FIG.v=()=>f([[40,15,8],[100,35,16],[160,65,24],[220,100,32]].map((p,i)=>C(p[0],p[1],8,'#d93c3c')+A(p[0],p[1]+9,p[0],p[1]+9+p[2])+T(p[0],157,['v=0','9,8 m/s','19,6 m/s','29,4 m/s'][i],10)).join(''));
const S=[
[`Og'irlik kuchi nima?`,`<p>Yer barcha jismlarni o'ziga tortadi. <b>Yerning jismni o'ziga tortish kuchi — og'irlik kuchi</b> deyiladi. Belgisi — F, birligi — nyuton (N).</p>`,'e'],
[`Butun olam tortishish`,`<p>Nyuton: massaga ega har qanday ikki jism bir-birini tortadi. Massa katta bo'lsa, tortishish kuchli; masofa ortsa, kuch kamayadi. Yerning massasi juda katta, shuning uchun uning tortishi seziladi.</p>`,'g'],
[`Erkin tushish tezlanishi`,`<p>Jism faqat og'irlik kuchi ta'sirida tushsa, har sekundda tezligi taxminan <b>9,8 m/s</b> ga ortadi. Yer sirtida <b>g ≈ 9,8 N/kg</b> (masalalarda ba'zan 10 N/kg olinadi).</p>`,'v'],
[`Og'irlik kuchi formulasi`,`<p><b>F = m · g</b>, bu yerda m — jism massasi (kg), g — erkin tushish tezlanishi (N/kg). Massa qancha katta bo'lsa, og'irlik kuchi shuncha katta.</p>`,'f'],
[`Og'irlik kuchining yo'nalishi`,`<p>Og'irlik kuchi doim <b>vertikal pastga</b>, ya'ni Yer markaziga qarab yo'nalgan.</p>`,'d'],
[`Qo'yilish nuqtasi`,`<p>Og'irlik kuchi jismning har bir zarrasiga ta'sir qiladi, lekin hisoblashda u bitta nuqtaga — <b>og'irlik markaziga</b> qo'yilgan deb olinadi.</p>`,'c'],
[`Jism og'irligi nima?`,`<p><b>Og'irlik (P)</b> — jismning Yerga tortilishi tufayli tayanchni bosadigan yoki osmani cho'zadigan kuchi. U tayanchga yoki osmaga qo'yiladi.</p>`,'p'],
[`Og'irlik kuchi va og'irlik farqi`,`<p>Og'irlik kuchi — <b>jismga</b> ta'sir qiladi (Yer tomonidan). Og'irlik — <b>tayanch yoki osmaga</b> ta'sir qiladi (jism tomonidan). Kuchlar tabiati ham, qo'yilish nuqtasi ham turlicha.</p>`,'df'],
[`Tinch holatdagi og'irlik`,`<p>Jism tayanchda yoki osmada tinch tursa: <b>P = F = m · g</b>. Son qiymati teng, lekin kuchlar har xil jismlarga qo'yilgan.</p>`,'b'],
[`Massa va og'irlik`,`<p>Massa — jismdagi modda miqdori va inertlik o'lchovi, kg da o'lchanadi. Og'irlik — kuch, N da o'lchanadi. Massa joydan joyga o'zgarmaydi, og'irlik esa g ga bog'liq.</p>`,'m'],
[`Dinamometr`,`<p><b>Dinamometr</b> — kuchni o'lchaydigan asbob. Prujinaning cho'zilishi kuchga proporsional. Unga osilgan jismning og'irligi shkaladan N da o'qiladi.</p>`,'s'],
[`Kuchni tasvirlash`,`<p>Kuch vektor kattalik: u <b>son qiymati, yo'nalishi va qo'yilish nuqtasi</b> bilan beriladi. Chizmada kuch masshtab bo'yicha strelka bilan ko'rsatiladi.</p>`,'vc'],
[`Boshqa sayyoralarda g`,`<p>g qiymati sayyora massasiga bog'liq. 1 kg jism og'irligi: Oyda 1,6 N, Marsda 3,7 N, Yerda 9,8 N, Yupiterda 24,8 N.</p>`,'pl'],
[`Vaznsizlik`,`<p>Agar jism va tayanch birgalikda erkin tushsa, jism tayanchni bosmaydi: <b>P = 0</b>. Bu holat <b>vaznsizlik</b> deyiladi (masalan, kosmik stansiyada). Og'irlik kuchi esa saqlanadi.</p>`,'w'],
[`Masala va xulosa`,`<p><b>Masala:</b> m = 5 kg jismning og'irlik kuchini toping. <b>Yechim:</b> F = m·g = 5·9,8 = <b>49 N</b>.</p><p><b>Xulosa:</b> F = m·g; vertikal pastga yo'nalgan; birligi — N; P va F farqlanadi; asbob — dinamometr.</p>`,'ex']];
let si=0;
function rs(){const s=S[si];$('#sl').innerHTML=`<h2>${si+1}. ${s[0]}</h2><div>${s[1]}</div><div class="fig">${FIG[s[2]]()}</div>`;$('#spg').textContent=(si+1)+' / '+S.length;[...$('#dots').children].forEach((d,i)=>d.classList.toggle('pr',i==si));if(si==S.length-1)add('sl',10)}
function go(d){si=Math.max(0,Math.min(S.length-1,si+d));rs()}
S.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>{si=i;rs()};$('#dots').append(b)});
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(cur==0){if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)}});
let tx=0;$('#s0').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#s0').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?1:-1)});
/* Canvas yordamchilar */
function ar(x,a,b,c,d,k){x.strokeStyle=x.fillStyle=k;x.lineWidth=5;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();const g=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-14*Math.cos(g-.4),d-14*Math.sin(g-.4));x.lineTo(c-14*Math.cos(g+.4),d-14*Math.sin(g+.4));x.fill()}
function zz(x,px,a,b){x.strokeStyle='#888';x.lineWidth=3;x.beginPath();x.moveTo(px,a);for(let i=1;i<=10;i++)x.lineTo(px+(i%2?-16:16),a+(b-a)*i/10);x.lineTo(px,b);x.stroke()}
/* SIM */
const S3={y:60,v:0},B=[0,0,0,0],PL=[['Oy',1.6],['Mars',3.7],['Yer',9.8],['Yupiter',24.8]];
const SM=[
{n:`Erkin tushish`,c:[[`g (N/kg)`,1.6,25,9.8,.1],[`Balandlik (m)`,20,150,100,5]],d(x,t,[g,H],c){const T=Math.sqrt(2*H/g),s=Math.min(t%(T+1),T),h=.5*g*s*s;x.fillStyle='#1b9e55';x.fillRect(0,290,600,30);x.fillStyle='#d93c3c';x.beginPath();x.arc(300,30+h/H*245,14,0,7);x.fill();x.fillStyle=c;x.fillText(`h = ${h.toFixed(1)} m`,330,40);return `t = ${s.toFixed(2)} s,  v = g·t = ${(g*s).toFixed(1)} m/s`}},
{n:`F = m·g`,c:[[`m (kg)`,1,20,5,1],[`g (N/kg)`,1.6,25,9.8,.1]],d(x,t,[m,g],c){const F=m*g,s=30+m*2.5,y=40+3*Math.sin(t*3),L=15+F/500*150;x.fillStyle='#0b78d1';x.fillRect(300-s/2,y,s,s);ar(x,300,y+s,300,y+s+L,'#d93c3c');x.fillStyle=c;x.fillText(`F = ${F.toFixed(1)} N`,330,y+s+L/2);return `F = ${m} × ${g} = ${F.toFixed(1)} N`}},
{n:`Dinamometr`,c:[[`m (kg)`,0,10,5,.5]],d(x,t,[m],c){const tg=40+m*18;S3.v+=(-80*(S3.y-tg)-5*S3.v)/60;S3.y+=S3.v/60;x.fillStyle='#889';x.fillRect(150,10,100,10);zz(x,200,20,20+S3.y);x.fillStyle='#0b78d1';x.fillRect(170,20+S3.y,60,40);x.fillStyle=c;x.fillText(`${(m*9.8).toFixed(1)} N`,250,45+S3.y);return `Dinamometr ko'rsatishi: P = m·g = ${m} × 9,8 = ${(m*9.8).toFixed(1)} N`}},
{n:`Sayyoralar`,c:[[`m (kg)`,1,10,5,1]],d(x,t,[m],c){PL.forEach((p,i)=>{B[i]+=(m*p[1]-B[i])*.08;const h=B[i]/250*240,bx=60+i*140;x.fillStyle='#0b78d1';x.fillRect(bx,280-h,90,h);x.fillStyle=c;x.fillText(p[0],bx+25,302);x.fillText(B[i].toFixed(0)+' N',bx+20,270-h)});return `m = ${m} kg hamma joyda bir xil, og'irlik esa g ga qarab o'zgaradi`}}];
let sm=0,t0=performance.now();
function bs(i){sm=i;t0=performance.now();[...$('#st').children].forEach((b,j)=>b.classList.toggle('on',j==i));$('#cs').innerHTML=SM[i].c.map((c,j)=>`<label>${c[0]}: <b id="o${j}">${c[3]}</b><input type="range" min="${c[1]}" max="${c[2]}" step="${c[4]}" value="${c[3]}"></label>`).join('');$('#cs').querySelectorAll('input').forEach((r,j)=>r.oninput=()=>{$('#o'+j).textContent=r.value;add('s'+i,5)})}

<!-- ===== E-MAKTAB SUPABASE TEST SYNC ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
(function() {
  'use strict';
  if (window.__EMAKTAB_TEST_HOOK_INJECTED__) return;
  window.__EMAKTAB_TEST_HOOK_INJECTED__ = true;

  try {
    if (Object.prototype.hasOwnProperty.call(window, 'localStorage')) {
      delete window.localStorage;
    }
  } catch(e) {}

  function getStudent() {
    try {
      var raw = localStorage.getItem("currentStudent") || localStorage.getItem("emaktab_student");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  var hasSubmitted = false;

  async function submitTestResults(score, total) {
    if (hasSubmitted) return;
    hasSubmitted = true;

    var student = getStudent();
    var lessonTitle = document.title || document.querySelector("h1, h2, .lesson-title")?.textContent?.trim() || "7-sinf Fizika darsi";
    lessonTitle = lessonTitle.replace(/—\s*7-sinf.*$/i, '').trim();

    var record = {
      student_id: (student && student.id) ? student.id : null,
      student_name: student ? [student.first_name, student.last_name].filter(Boolean).join(" ") : "Nomaʼlum oʻquvchi",
      phone: (student && student.phone) ? student.phone : "",
      grade: "7-sinf",
      subject: "Fizika",
      lesson_title: lessonTitle,
      score: Number(score || 0),
      total_questions: Number(total || 10),
      created_at: new Date().toISOString()
    };

    var client = (window.getSupabaseClient && window.getSupabaseClient()) || window.supabaseClient;
    if (client) {
      try {
        var res = await client.from("test_results").insert([record]);
        if (res.error) {
          console.warn("[E-Maktab] Test submission error:", res.error);
        } else {
          showBadgeInTestCard("✅ Natija serverga yuborildi");
        }
      } catch(err) {
        console.warn("[E-Maktab] Test submission failed:", err);
      }
    }
  }

  function showBadgeInTestCard(msg) {
    var card = document.querySelector("#test .card, #test, #tq, main");
    if (!card) return;
    if (document.getElementById("emaktab-sync-badge")) return;
    var badge = document.createElement("div");
    badge.id = "emaktab-sync-badge";
    badge.setAttribute("style", "margin-top:14px;padding:8px 14px;background:rgba(27,158,85,0.12);border:1px solid #1b9e55;border-radius:10px;color:#1b9e55;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;");
    badge.textContent = msg;
    card.appendChild(badge);
  }

  function checkTestContainer() {
    if (hasSubmitted) return;
    var root = document.querySelector("#test, #tq, main") || document.body;
    if (!root) return;
    var text = root.innerText || root.textContent || "";

    // Pattern 1: "Siz X savoldan Y tasiga to'g'ri javob berdingiz"
    var m1 = text.match(/(\d+)\s*savoldan\s*(\d+)\s*tasiga/i);
    if (m1) {
      var total1 = parseInt(m1[1], 10);
      var score1 = parseInt(m1[2], 10);
      submitTestResults(score1, total1);
      return;
    }

    // Pattern 2: "Natija: X / Y to'g'ri"
    var m2 = text.match(/Natija:\s*(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m2) {
      var score2 = parseInt(m2[1], 10);
      var total2 = parseInt(m2[2], 10);
      submitTestResults(score2, total2);
      return;
    }

    // Pattern 3: "X / Y to'g'ri"
    var m3 = text.match(/(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m3) {
      var score3 = parseInt(m3[1], 10);
      var total3 = parseInt(m3[2], 10);
      submitTestResults(score3, total3);
      return;
    }
  }

  var observer = new MutationObserver(function() {
    checkTestContainer();
  });

  document.addEventListener("click", function(e) {
    if (e.target && (e.target.id === "qRetry" || e.target.id === "qr" || e.target.closest("#qRetry, #qr"))) {
      hasSubmitted = false;
      var b = document.getElementById("emaktab-sync-badge");
      if (b) b.remove();
    }
  });

  function startObserver() {
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    checkTestContainer();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startObserver);
  } else {
    startObserver();
  }
})();
</script>
<!-- ===== END E-MAKTAB SUPABASE TEST SYNC ===== -->
