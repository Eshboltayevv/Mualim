<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elastiklik kuchi. Guk qonuni — 7-sinf fizika</title>
<style>
:root{--bg:#e6f3ff;--c:rgba(255,255,255,.72);--tx:#12324d;--p:#0b78d1;--ok:#1b9e55;--er:#d93c3c;--bd:rgba(255,255,255,.9);--g:linear-gradient(120deg,#0b78d1,#19b5c9)}
[data-t=d]{--bg:#0c1a2b;--c:rgba(28,48,74,.72);--tx:#e6f2ff;--bd:rgba(255,255,255,.1)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.w{max-width:960px;margin:auto;padding:10px}
.card{background:var(--c);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 8px 24px rgba(11,120,209,.15)}
h1,h2,h3{margin:.2em 0;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:1.4rem}
button,select{min-height:44px;border-radius:14px;border:1px solid rgba(11,120,209,.35);background:var(--c);color:var(--tx);font:inherit;padding:0 14px;cursor:pointer}
button:hover{border-color:var(--p)}
button.pb,nav button.on,.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
button:disabled{opacity:.7;cursor:default}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
nav button{flex:1;white-space:nowrap;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{font-weight:700}
.pr{height:10px;border-radius:9px;background:rgba(11,120,209,.2);overflow:hidden;flex:1;min-width:80px}
.pr i{display:block;height:100%;width:0;background:var(--g);transition:width .3s}
section{display:none}section.on{display:block}
canvas{width:100%;height:auto;border-radius:16px;background:rgba(255,255,255,.6);display:block;touch-action:manipulation}
[data-t=d] canvas{background:rgba(10,25,45,.7)}
#vc{touch-action:none;cursor:grab}
.sv{min-height:150px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.dots b{width:14px;height:14px;border-radius:50%;background:rgba(11,120,209,.25);cursor:pointer;border:0}
.dots b.on{background:var(--p);transform:scale(1.3)}
.o{display:block;width:100%;text-align:left;margin:6px 0}
.o.ok,.ok{border-color:var(--ok)}.o.ok{background:rgba(27,158,85,.25)}
.o.no,.no{border-color:var(--er)}.o.no{background:rgba(217,60,60,.25)}
p.ok{color:var(--ok);font-weight:700}p.no{color:var(--er);font-weight:700}
.ct{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.ct label{min-width:110px}.ct input[type=range]{flex:1;min-width:120px;height:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{min-height:70px;font-size:1.15rem;font-weight:700}
.fs:fullscreen,.fake{background:var(--bg);padding:10px;overflow:auto}
.fake{position:fixed;inset:0;z-index:50}
.sub{min-height:48px;padding:8px;border-radius:12px;background:rgba(11,120,209,.12);font-weight:600;margin-top:6px}
@media(max-width:560px){h1{font-size:1.15rem}.g2{grid-template-columns:1fr 1fr}.ct label{min-width:100%}}
</style>
</head>
<body>
<div class="w">
<div class="card">
<h1>⚙️ Elastiklik kuchi. Guk qonuni</h1>
<div class="bar" style="margin-top:6px">
<span class="stat">Ball: <span id="sc">0</span></span><span class="stat" id="st">☆☆☆☆☆</span><span class="stat">⏱ <span id="tm">00:00</span></span>
<div class="pr"><i id="pg"></i></div>
</div>
<div class="bar" style="margin-top:8px">
<button id="th" aria-label="Rejim">🌙</button>
<button id="sp">🔊 O‘qish</button>
<select id="lg" aria-label="Til"><option value="uz-UZ">O‘zbek</option><option value="ru-RU">Русский</option><option value="en-US">English</option></select>
<select id="rt" aria-label="Tezlik"><option value="0.7">Sekin</option><option value="1" selected>Normal</option><option value="1.3">Tez</option></select>
</div>
</div>
<nav id="nv"></nav>

<section id="s0" class="on card">
<div id="sl"></div>
<div class="dots" id="dt"></div>
<div class="bar"><button id="pv">← Orqaga</button><div class="pr"><i id="sp2"></i></div><span id="sn" class="stat"></span><button id="nx" class="pb">Oldinga →</button></div>
</section>

<section id="s1" class="card">
<h2>Simulyatsiyalar</h2>
<div class="bar" id="stb"></div>
<canvas id="sc1" width="600" height="340"></canvas>
<div id="sct"></div>
</section>

<section id="s2" class="card">
<div id="vw" class="fs">
<h2>VR laboratoriya</h2>
<canvas id="vc" width="600" height="380"></canvas>
<div class="bar" style="margin-top:8px">
<button id="v1" class="pb">+ 100 g</button><button id="v2">− 100 g</button><button id="v3">⟳ Ko‘rinish</button><button id="v4">⛶ To‘liq ekran</button>
</div>
<p>Sichqoncha yoki barmoq bilan sahnani aylantiring, g‘ildirak bilan yaqinlashtiring. Yuk qo‘shib, prujina cho‘zilishini kuzating.</p>
</div>
</section>

<section id="s3" class="card">
<h2>Video-dars</h2>
<canvas id="vd" width="600" height="340"></canvas>
<div class="sub" id="sb"></div>
<input type="range" id="vs" min="0" max="300" value="0" style="width:100%;height:32px">
<div class="bar"><button id="vp" class="pb">▶ Boshlash</button><button id="vr">↺ Qaytadan</button></div>
</section>

<section id="s4" class="card">
<h2>Test</h2>
<div id="tq"></div>
</section>

<section id="s5" class="card">
<h2>O‘yinlar</h2>
<div class="bar" id="gtb"></div>
<div id="gm" style="margin-top:10px"></div>
</section>
</div>

<script>
const $=s=>document.querySelector(s);
const MAX=105;
let st={s:0,d:{},t:0};
try{const x=JSON.parse(localStorage.getItem('guk'));if(x&&x.d)st=x}catch(e){}
function save(){try{localStorage.setItem('guk',JSON.stringify(st))}catch(e){}}
function upd(){
 $('#sc').textContent=st.s;
 const n=Math.min(5,Math.round(st.s/MAX*5));
 $('#st').textContent='★'.repeat(n)+'☆'.repeat(5-n);
 $('#pg').style.width=Math.min(100,st.s/MAX*100)+'%';save();
}
function add(p,k){if(st.d[k])return;st.d[k]=1;st.s+=p;upd()}
setInterval(()=>{st.t++;const m=Math.floor(st.t/60),s=st.t%60;$('#tm').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(st.t%5==0)save()},1000);

/* theme */
let TC='#12324d';
function setTh(d){document.documentElement.dataset.t=d?'d':'l';$('#th').textContent=d?'☀️':'🌙';TC=d?'#e6f2ff':'#12324d';try{localStorage.setItem('gukth',d?1:0)}catch(e){}}
$('#th').onclick=()=>setTh(document.documentElement.dataset.t!='d');
let sd=0;try{sd=+localStorage.getItem('gukth')}catch(e){}
setTh(!!sd);

/* speech */
$('#sp').onclick=()=>{
 if(!('speechSynthesis' in window)){alert('Brauzeringiz ovozli o‘qishni qo‘llamaydi');return}
 if(speechSynthesis.speaking){speechSynthesis.cancel();$('#sp').textContent='🔊 O‘qish';return}
 const u=new SpeechSynthesisUtterance(document.querySelector('section.on').innerText.slice(0,2500));
 u.lang=$('#lg').value;u.rate=+$('#rt').value;
 u.onend=u.onerror=()=>{$('#sp').textContent='🔊 O‘qish'};
 $('#sp').textContent='⏹ To‘xtatish';speechSynthesis.speak(u);
};

/* nav */
const NAMES=['📖 Slaydlar','🧪 Simulyatsiya','🥽 VR','🎬 Video','📝 Test','🎮 O‘yinlar'];
let cs=0;
NAMES.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);$('#nv').appendChild(b)});
function show(i){
 cs=i;if('speechSynthesis' in window){speechSynthesis.cancel();$('#sp').textContent='🔊 O‘qish'}
 document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',j==i));
 document.querySelectorAll('#nv button').forEach((b,j)=>b.classList.toggle('on',j==i));
 if(i==2)add(5,'vr');
}

/* SVG helpers */
const W=b=>`<svg viewBox="0 0 300 150" width="100%" role="img" style="max-height:200px">${b}</svg>`;
const sp=(x1,y1,x2,y2,n=8)=>{const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,px=-dy/L*11,py=dx/L*11;let d=`M${x1} ${y1}L${x1+dx*.1} ${y1+dy*.1}`;for(let i=0;i<n;i++){const f=.1+.8*(i+.5)/n,s=i%2?-1:1;d+=`L${(x1+dx*f+px*s).toFixed(1)} ${(y1+dy*f+py*s).toFixed(1)}`}d+=`L${x1+dx*.9} ${y1+dy*.9}L${x2} ${y2}`;return `<path d="${d}" fill="none" stroke="#0b78d1" stroke-width="2.5" stroke-linejoin="round"/>`};
const ar=(x1,y1,x2,y2,c='#d93c3c')=>{const a=Math.atan2(y2-y1,x2-x1),h=d=>`${x2-9*Math.cos(a+d)},${y2-9*Math.sin(a+d)}`;return `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${c}" stroke-width="3"/><polygon points="${x2},${y2} ${h(.4)} ${h(-.4)}" fill="${c}"/>`};
const tx=(x,y,t,s=11)=>`<text x="${x}" y="${y}" text-anchor="middle" fill="currentColor" font-size="${s}">${t}</text>`;
const bx=(x,y,w,h,c='#19b5c9')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${c}"/>`;
const ce=x=>bx(x-25,8,50,8,'#7a8a99');
const AX=`<path d="M40 128V15M40 128H285" stroke="currentColor" fill="none" stroke-width="1.5"/>`+tx(28,22,'F')+tx(280,142,'Δl');
const FIG=[
()=>W(ce(70)+sp(70,16,70,70)+bx(55,70,30,18)+tx(70,110,'Deformatsiyasiz')+ce(220)+sp(220,16,220,115)+bx(205,115,30,18)+tx(220,145,'Cho‘zilgan')+ar(260,70,260,115,'#1b9e55')+tx(278,95,'Δl',12)),
()=>W([50,150,250].map((x,i)=>ce(x)+sp(x,16,x,[60,105,60][i])+bx(x-12,[60,105,60][i],24,14)).join('')+tx(50,125,'Boshlang‘ich')+tx(150,138,'Cho‘zilgan')+tx(250,125,'Qaytdi ✓')+ar(100,70,200,70,'#1b9e55')),
()=>W(`<ellipse cx="70" cy="75" rx="32" ry="32" fill="#c58a52"/><ellipse cx="225" cy="95" rx="55" ry="14" fill="#c58a52"/>`+ar(70,20,70,42)+ar(225,45,225,78)+ar(120,75,170,90,'#1b9e55')+tx(150,135,'Shakl tiklanmaydi',12)),
()=>W(`${bx(8,30,45,16)}${ar(5,38,-2,38)}${ar(56,38,66,38)}${tx(30,70,'Cho‘zilish',9)}${bx(78,30,45,16)}${ar(70,38,78,38)}${ar(131,38,123,38)}${tx(100,70,'Siqilish',9)}<path d="M138 46Q165 20 192 46" stroke="#0b78d1" stroke-width="8" fill="none"/>${tx(165,70,'Egilish',9)}<path d="M205 30l40 16M205 46l40-16" stroke="#0b78d1" stroke-width="4"/>${tx(225,70,'Buralish',9)}<polygon points="255,46 270,30 295,30 280,46" fill="#19b5c9"/>${tx(272,70,'Siljish',9)}${tx(150,115,'5 xil deformatsiya',13)}`),
()=>W(ce(110)+sp(110,16,110,85)+bx(95,85,30,24)+ar(110,85,110,35,'#1b9e55')+tx(165,55,'F<tspan font-size="8" dy="3">el</tspan>',13)+ar(110,110,110,145)+tx(150,135,'mg',13)),
()=>W(`${bx(10,40,10,70,'#7a8a99')}${sp(20,75,120,75)}${bx(120,60,32,30)}${ar(190,75,250,75)}${tx(222,62,'F tashqi')}${ar(120,40,75,40,'#1b9e55')}${tx(95,30,'F el')}${tx(150,135,'F el — deformatsiyaga qarama-qarshi')}`),
()=>W(`<rect x="40" y="25" width="220" height="60" rx="14" fill="#0b78d1" opacity=".18"/>`+tx(150,67,'F = k · Δl',30)+tx(150,110,'F — elastiklik kuchi (N)',12)+tx(150,126,'k — bikrlik (N/m), Δl — uzayish (m)',12)),
()=>W(ce(80)+sp(80,16,80,70,5)+bx(66,70,28,16)+tx(80,110,'k kichik (yumshoq)')+ce(220)+sp(220,16,220,40,14)+bx(206,40,28,16)+tx(220,80,'k katta (qattiq)')+tx(150,140,'Bir xil yuk — har xil uzayish')),
()=>W(AX+`<path d="M40 128L260 28" stroke="#0b78d1" stroke-width="3"/>`+[[100,101],[150,78],[200,55],[250,33]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#d93c3c"/>`).join('')+tx(215,100,'qiyalik = k')),
()=>W(bx(115,10,70,100,'#cfd8e0')+`<path d="M150 14V60" stroke="#0b78d1" stroke-width="4"/>`+[0,1,2,3,4].map(i=>`<path d="M185 ${25+i*18}h-14" stroke="#333"/>${tx(200,29+i*18,i+' N',9)}`).join('')+`<polygon points="130,60 118,54 118,66" fill="#d93c3c"/>`+`<path d="M150 110v15" stroke="#333" stroke-width="2"/>`+bx(138,125,24,18)+tx(60,60,'Dinamometr',12)),
()=>W(ce(110)+sp(110,16,110,100)+bx(95,100,30,22)+ar(110,100,110,60,'#1b9e55')+tx(170,50,'k = 100 N/m',11)+tx(170,70,'Δl = 0,02 m',11)+tx(170,95,'F = 2 N',14)),
()=>W(AX+`<path d="M40 128L260 33" stroke="#0b78d1" stroke-width="3"/><path d="M135 128V87M40 87H135" stroke="#d93c3c" stroke-dasharray="4"/><circle cx="135" cy="87" r="5" fill="#d93c3c"/>`+tx(135,142,'4 sm')+tx(22,90,'8 N')+tx(220,110,'k = 8/0,04 = 200')),
()=>W(ce(110)+sp(110,16,110,85)+bx(95,85,30,24)+ar(110,85,110,40,'#1b9e55')+ar(110,110,110,145)+tx(190,55,'F el = mg')+tx(190,75,'Δl = mg / k')+tx(190,125,'m = 0,5 kg → Δl = 5 sm')),
()=>W(bx(80,10,140,10,'#7a8a99')+sp(110,20,110,100,7)+sp(190,20,190,100,7)+bx(80,100,140,12,'#19b5c9')+tx(150,135,'Amortizator / matras prujinalari',12)),
()=>W(AX+`<path d="M40 128L150 70Q190 55 230 52" stroke="#0b78d1" stroke-width="3" fill="none"/><path d="M150 128V70" stroke="#d93c3c" stroke-dasharray="4"/>`+tx(100,50,'Guk qonuni o‘rinli')+tx(220,40,'plastik')+tx(150,142,'chegara'))
];
const S=[
['Deformatsiya nima?',`Jismga kuch ta’sir qilganda uning shakli yoki o‘lchami o‘zgarishi <b>deformatsiya</b> deyiladi. Prujina cho‘zilganda uzunligi o‘zgaradi. O‘zgarish miqdori <b>uzayish</b> deyiladi: Δl = l − l₀.`],
['Elastik deformatsiya',`Kuch olingach jism avvalgi shaklini tiklasa, bunday deformatsiya <b>elastik</b> deyiladi. Misol: prujina, rezina, po‘lat sim.`],
['Plastik deformatsiya',`Kuch olingandan keyin jism shaklini tiklamasa, deformatsiya <b>plastik</b> deyiladi. Misol: plastilin, nam loy, qo‘rg‘oshin.`],
['Deformatsiya turlari',`Cho‘zilish, siqilish, egilish, buralish va siljish — deformatsiyaning asosiy turlari. Prujinada asosan cho‘zilish va siqilish kuzatiladi.`],
['Elastiklik kuchi',`Deformatsiyalangan jismda paydo bo‘lib, uni avvalgi holatiga qaytarishga intiluvchi kuch <b>elastiklik kuchi</b> (F<sub>el</sub>) deyiladi. Birligi — nyuton (N).`],
['Kuchning yo‘nalishi',`Elastiklik kuchi deformatsiyaga qarama-qarshi yo‘nalgan: cho‘zilgan prujina qisqarishga, siqilgan prujina cho‘zilishga intiladi.`],
['Guk qonuni',`Ingliz olimi Robert Guk (XVII asr) qonuni: kichik elastik deformatsiyada elastiklik kuchi jismning uzayishiga to‘g‘ri proporsional.<br><b>F = k · Δl</b>`],
['Bikrlik koeffitsiyenti k',`k — jismning bikrligi, birligi N/m. k qancha katta bo‘lsa, prujina shuncha qattiq. Formula: <b>k = F / Δl</b>. U material, o‘lcham va shaklga bog‘liq.`],
['F(Δl) grafigi',`Guk qonuni grafigi koordinata boshidan o‘tuvchi to‘g‘ri chiziqdir. Chiziqning qiyaligi bikrlik k ni bildiradi.`],
['Dinamometr',`Kuchni o‘lchaydigan asbob — <b>dinamometr</b>. U Guk qonuniga asoslangan: prujinaning uzayishi kuchga proporsional, shkala nyutonlarda darajalangan.`],
['Masala 1',`Berilgan: k = 100 N/m, Δl = 2 sm = 0,02 m. Topish: F.<br>Yechish: F = k·Δl = 100 · 0,02 = <b>2 N</b>.`],
['Masala 2',`Prujinani 4 sm cho‘zish uchun 8 N kuch kerak. k topilsin.<br>k = F/Δl = 8 / 0,04 = <b>200 N/m</b>.`],
['Muvozanat va og‘irlik',`Prujinaga osilgan yuk tinch tursa, F<sub>el</sub> = mg. Demak, Δl = mg/k. m = 0,5 kg, k = 100 N/m bo‘lsa: Δl = 5/100 = 0,05 m = <b>5 sm</b> (g ≈ 10 m/s²).`],
['Amaliy qo‘llanilishi',`Avtomobil amortizatorlari, matras va trampolin prujinalari, dinamometr, mexanik soatlar — hammasida elastiklik kuchidan foydalaniladi.`],
['Guk qonuni chegarasi',`Guk qonuni faqat <b>elastiklik chegarasigacha</b> o‘rinli. Undan oshsa, deformatsiya plastik bo‘ladi va F ∝ Δl munosabati buziladi.`]
].map((s,i)=>[s[0],s[1],i]);
let si=0;
S.forEach((s,i)=>{const b=document.createElement('b');b.onclick=()=>goS(i);b.setAttribute('role','button');b.setAttribute('aria-label','Slayd '+(i+1));$('#dt').appendChild(b)});
function goS(i){
 si=Math.max(0,Math.min(S.length-1,i));
 const s=S[si];
 $('#sl').innerHTML=`<h2>${si+1}. ${s[0]}</h2><div class="sv">${FIG[s[2]]()}</div><p>${s[1]}</p>`;
 document.querySelectorAll('#dt b').forEach((d,j)=>d.classList.toggle('on',j==si));
 $('#sn').textContent=(si+1)+' / '+S.length;
 $('#sp2').style.width=(si+1)/S.length*100+'%';
 $('#pv').disabled=si==0;$('#nx').disabled=si==S.length-1;
 add(1,'s'+si);
}
$('#pv').onclick=()=>goS(si-1);$('#nx').onclick=()=>goS(si+1);
document.addEventListener('keydown',e=>{if(cs!=0)return;if(e.key=='ArrowRight')goS(si+1);if(e.key=='ArrowLeft')goS(si-1)});
let x0=0;
$('#s0').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
$('#s0').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)goS(si+(d<0?1:-1))},{passive:true});

/* canvas helpers */
function cSp(c,x,y1,y2,n,w){c.beginPath();c.moveTo(x,y1);const h=Math.min(12,(y2-y1)/4),L=y2-y1-2*h;c.lineTo(x,y1+h);for(let i=0;i<n;i++)c.lineTo(x+(i%2?-w:w),y1+h+L*(i+.5)/n);c.lineTo(x,y2-h);c.lineTo(x,y2);c.strokeStyle='#0b78d1';c.lineWidth=3;c.lineJoin='round';c.stroke()}
function cT(c,t,x,y,s=16,col){c.fillStyle=col||TC;c.font=`600 ${s}px system-ui`;c.textAlign='left';c.fillText(t,x,y)}
function cBox(c,x,y,w,h,col='#19b5c9'){c.fillStyle=col;c.fillRect(x,y,w,h);c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;c.strokeRect(x,y,w,h)}
function cCe(c,x){c.fillStyle='#7a8a99';c.fillRect(x-50,10,100,12)}
function cAx(c,ox,oy,w,h,lx,ly){c.strokeStyle=TC;c.lineWidth=2;c.beginPath();c.moveTo(ox,oy-h);c.lineTo(ox,oy);c.lineTo(ox+w,oy);c.stroke();cT(c,ly,ox-6,oy-h-8,14);cT(c,lx,ox+w-60,oy+26,14)}

/* SIMULATIONS */
const SIMS=[
{n:'Prujina va yuk',c:[['m','Massa m (kg)',.1,2,.5,.1],['k','Bikrlik k (N/m)',20,200,80,5]],
 d(c,p,S,dt){S.y=S.y||0;S.v=S.v||0;const eq=p.m*10/p.k;S.v+=(-(p.k/p.m)*(S.y-eq)-1.2*S.v)*dt;S.y+=S.v*dt;
  const e=Math.max(0,Math.min(S.y*200,235)),y2=70+e;cCe(c,200);cSp(c,200,22,y2,10,18);const s=28+p.m*14;cBox(c,200-s/2,y2,s,s*.8);
  c.setLineDash([5,4]);c.strokeStyle='#1b9e55';c.beginPath();c.moveTo(120,70+Math.min(eq*200,235));c.lineTo(280,70+Math.min(eq*200,235));c.stroke();c.setLineDash([]);

  function getStudent() {
    try {
      var raw = localStorage.getItem("currentStudent") || localStorage.getItem("emaktab_student");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  var hasSubmitted = false;

  async function submitTestResults(score, total) {
    if (hasSubmitted) return;
    hasSubmitted = true;

    var student = getStudent();
    var lessonTitle = document.title || document.querySelector("h1, h2, .lesson-title")?.textContent?.trim() || "7-sinf Fizika darsi";
    lessonTitle = lessonTitle.replace(/—\s*7-sinf.*$/i, '').trim();

    var record = {
      student_id: (student && student.id) ? student.id : null,
      student_name: student ? [student.first_name, student.last_name].filter(Boolean).join(" ") : "Nomaʼlum oʻquvchi",
      phone: (student && student.phone) ? student.phone : "",
      grade: "7-sinf",
      subject: "Fizika",
      lesson_title: lessonTitle,
      score: Number(score || 0),
      total_questions: Number(total || 10),
      created_at: new Date().toISOString()
    };

    var client = (window.getSupabaseClient && window.getSupabaseClient()) || window.supabaseClient;
    if (client) {
      try {
        var res = await client.from("test_results").insert([record]);
        if (res.error) {
          console.warn("[E-Maktab] Test submission error:", res.error);
        } else {
          showBadgeInTestCard("✅ Natija serverga yuborildi");
        }
      } catch(err) {
        console.warn("[E-Maktab] Test submission failed:", err);
      }
    }
  }

  function showBadgeInTestCard(msg) {
    var card = document.querySelector("#test .card, #test, #tq, main");
    if (!card) return;
    if (document.getElementById("emaktab-sync-badge")) return;
    var badge = document.createElement("div");
    badge.id = "emaktab-sync-badge";
    badge.setAttribute("style", "margin-top:14px;padding:8px 14px;background:rgba(27,158,85,0.12);border:1px solid #1b9e55;border-radius:10px;color:#1b9e55;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;");
    badge.textContent = msg;
    card.appendChild(badge);
  }

  function checkTestContainer() {
    if (hasSubmitted) return;
    var root = document.querySelector("#test, #tq, main") || document.body;
    if (!root) return;
    var text = root.innerText || root.textContent || "";

    // Pattern 1: "Siz X savoldan Y tasiga to'g'ri javob berdingiz"
    var m1 = text.match(/(\d+)\s*savoldan\s*(\d+)\s*tasiga/i);
    if (m1) {
      var total1 = parseInt(m1[1], 10);
      var score1 = parseInt(m1[2], 10);
      submitTestResults(score1, total1);
      return;
    }

    // Pattern 2: "Natija: X / Y to'g'ri"
    var m2 = text.match(/Natija:\s*(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m2) {
      var score2 = parseInt(m2[1], 10);
      var total2 = parseInt(m2[2], 10);
      submitTestResults(score2, total2);
      return;
    }

    // Pattern 3: "X / Y to'g'ri"
    var m3 = text.match(/(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m3) {
      var score3 = parseInt(m3[1], 10);
      var total3 = parseInt(m3[2], 10);
      submitTestResults(score3, total3);
      return;
    }
  }

  var observer = new MutationObserver(function() {
    checkTestContainer();
  });

  document.addEventListener("click", function(e) {
    if (e.target && (e.target.id === "qRetry" || e.target.id === "qr" || e.target.closest("#qRetry, #qr"))) {
      hasSubmitted = false;
      var b = document.getElementById("emaktab-sync-badge");
      if (b) b.remove();
    }
  });

  function startObserver() {
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    checkTestContainer();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startObserver);
  } else {
    startObserver();
  }
})();
</script>
<!-- ===== END E-MAKTAB SUPABASE TEST SYNC ===== -->
