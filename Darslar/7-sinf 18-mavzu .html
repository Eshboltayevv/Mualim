<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bosim va uning yuzaga bog'liqligi</title>
<style>
:root{--bg:#e6f3ff;--c:#0b2a45;--cd:rgba(255,255,255,.72);--p:#0b78d1;--ok:#1b9e55;--er:#d93c3c;--bd:rgba(11,120,209,.22)}
body.dark{--bg:#0a1b2c;--c:#e8f4ff;--cd:rgba(20,45,70,.72);--bd:rgba(120,190,255,.25)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--c);padding:10px;min-height:100vh;line-height:1.5}
.w{max-width:1000px;margin:auto}
.card{background:var(--cd);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(11,120,209,.15)}
h1,h2{background:linear-gradient(120deg,#0b78d1,#19b5c9);-webkit-background-clip:text;background-clip:text;color:transparent;margin:.2em 0}
h1{font-size:1.3rem}
button,select{min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--c);padding:0 14px;font:inherit;cursor:pointer}
button.on,button.pr{background:var(--p);color:#fff;border-color:var(--p)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.er{background:var(--er);color:#fff;border-color:var(--er)}
button:disabled{opacity:1;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{display:none}.sec.on{display:block}
svg{width:100%;max-height:260px;color:var(--c)}
canvas{width:100%;height:auto;border-radius:14px;background:rgba(255,255,255,.55);touch-action:none;display:block}
body.dark canvas{background:rgba(0,0,0,.3)}
.pb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;width:0;background:linear-gradient(120deg,#0b78d1,#19b5c9);transition:width .3s}
.dot{min-height:0;width:14px;height:14px;padding:0;border-radius:50%}
label{display:block;flex:1 1 200px}
input[type=range]{width:100%;height:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 button{width:100%;margin-bottom:8px;padding:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g4 button{height:64px;padding:2px;font-size:.8rem}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 14px}
#vrw:fullscreen{background:var(--bg);overflow:auto;padding:10px}
#vrw:fullscreen canvas{max-height:60vh;object-fit:contain}
.fig{margin-top:8px}
</style></head><body><div class="w">
<div class="card"><div class="row" style="justify-content:space-between"><h1>📌 Bosim va uning yuzaga bog'liqligi · 7-sinf</h1><button id="th">🌓 Mavzu</button></div>
<div class="row"><b id="sc"></b><span id="stars" style="color:#f5a623;font-size:1.2rem"></span><span id="tm">⏱ 0:00</span></div><div class="pb"><i id="pb"></i></div>
<div class="row" style="margin-top:8px"><button id="spk">🔊 O'qish</button><select id="rt"><option value=".7">Sekin</option><option value="1" selected>Normal</option><option value="1.4">Tez</option></select><select id="lg"><option value="uz-UZ">O'zbek</option><option value="ru-RU">Русский</option><option value="en-US">English</option></select></div></div>
<div class="card row" id="nav"></div>

<div id="s0" class="sec card on"><div id="sl"></div><div class="row"><button id="pv">‹ Orqaga</button><button id="nx" class="pr">Oldinga ›</button><b id="spg"></b></div><div id="dots" class="row" style="margin-top:10px"></div></div>

<div id="s1" class="sec card"><div class="row" id="st"></div><canvas id="cv" width="600" height="320"></canvas><p><b id="inf"></b></p><div id="cs" class="row"></div></div>

<div id="s2" class="sec"><div id="vrw" class="card"><canvas id="vr" width="640" height="360"></canvas><p style="margin:6px 0">Sichqoncha yoki barmoq bilan sahnani aylantiring.</p>
<div class="row"><label>G'isht massasi: <b id="vmo">5</b> kg<input type="range" id="vm" min="1" max="10" value="5"></label></div>
<div class="row" style="margin-top:8px"><select id="vp"><option value="0">Yotqizilgan (S = 0,08 m²)</option><option value="1">Yon tomonda (S = 0,04 m²)</option><option value="2">Tik (S = 0,02 m²)</option></select><button id="vd" class="pr">⬇ Qo'yish</button><button id="vs">👓 Stereo</button><button id="vf">⛶ To'liq ekran</button><button id="v0">↺ Ko'rinish</button></div></div></div>

<div id="s3" class="sec card"><canvas id="vc" width="600" height="320"></canvas><p id="sub" style="min-height:3em;font-weight:600"></p><input type="range" id="vk" min="0" max="40" step=".1" value="0"><div class="row"><button id="vpl" class="pr">▶ Play</button><button id="vpa">⏸ Pauza</button><button id="vre">↺ Qaytadan</button><b id="vtm"></b></div></div>

<div id="s4" class="sec card"><div id="tq"></div></div>
<div id="s5" class="sec card"><div class="row" id="gt"></div><div id="gm" style="margin-top:12px"></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
let st;try{st=JSON.parse(localStorage.getItem('bos7'))||{}}catch(e){st={}}
st.p=st.p||{};st.t=st.t||0;
const sv=()=>{try{localStorage.setItem('bos7',JSON.stringify(st))}catch(e){}},MAX=110;
const col=()=>document.body.classList.contains('dark')?'#e8f4ff':'#0b2a45';
function upd(){const s=Object.values(st.p).reduce((a,b)=>a+b,0),k=Math.round(s/MAX*5);$('#sc').textContent='Ball: '+s+'/'+MAX;$('#stars').textContent='★'.repeat(k)+'☆'.repeat(5-k);$('#pb').style.width=Math.min(100,s/MAX*100)+'%'}
function add(k,v){if((st.p[k]||0)<v){st.p[k]=v;sv();upd()}}
setInterval(()=>{st.t++;$('#tm').textContent='⏱ '+Math.floor(st.t/60)+':'+String(st.t%60).padStart(2,'0');if(st.t%5==0)sv()},1000);
document.body.classList.toggle('dark',!!st.d);
$('#th').onclick=()=>{st.d=!st.d;document.body.classList.toggle('dark',st.d);sv()};
let cur=0;
`📖 Slaydlar,🧪 Simulyatsiya,🥽 VR,🎬 Video,📝 Test,🎮 O'yinlar`.split(',').forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);$('#nav').append(b)});
function show(i){cur=i;for(let j=0;j<6;j++)$('#s'+j).classList.toggle('on',j==i);[...$('#nav').children].forEach((b,j)=>b.classList.toggle('on',j==i));if(i!=3)vp=false;try{speechSynthesis.cancel()}catch(e){}}
/* SVG */
const f=b=>`<svg viewBox="0 0 300 160"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#d93c3c"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#0b78d1"/></marker></defs>${b}</svg>`;
const T=(x,y,s,z=12,c='currentColor')=>`<text x="${x}" y="${y}" font-size="${z}" text-anchor="middle" fill="${c}">${s}</text>`;
const A=(a,b,c,d,k=0)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${k?'#0b78d1':'#d93c3c'}" stroke-width="3" marker-end="url(#${k?'ab':'ar'})"/>`;
const C=(x,y,r,l)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${l}"/>`;
const R=(x,y,w,h,l)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${l}"/>`;
const FL='#8a6d3b',BX='rgba(11,120,209,.22)';
const FIG={
a:()=>f(R(40,100,220,10,FL)+R(110,55,80,45,'#0b78d1')+T(150,82,'jism',12,'#fff')+A(150,100,150,148)+T(185,135,'F',14)+T(150,22,`Bosim — kuchning sirt yuzasiga ta'siri`,12)),
b:()=>f(`<polygon points="40,130 260,130 260,60" fill="${FL}"/><polygon points="126,103 174,87 165,59 117,74" fill="#0b78d1"/>`+A(150,95,164,138)+T(215,105,'F ⟂ sirt',12)+T(150,18,`Bosim kuchi sirtga perpendikulyar`,12)),
c:()=>f(R(50,30,200,55,'#0b78d1')+T(150,67,'p = F / S',26,'#fff')+T(150,110,`p — bosim (Pa), F — bosim kuchi (N)`,11)+T(150,130,`S — sirt yuzasi (m²)`,11)),
d:()=>f(R(20,10,260,30,BX)+T(150,31,'1 Pa = 1 N / 1 m²',14)+R(20,48,260,30,BX)+T(150,69,'1 kPa = 1000 Pa',14)+R(20,86,260,30,BX)+T(150,107,'1 MPa = 1 000 000 Pa',14)+T(150,145,`Birlik fizik Blez Paskal sharafiga`,11)),
e:()=>f([1,2,3].map((k,i)=>[...Array(k)].map((_,j)=>R(40+i*90,104-j*26,60,24,'#0b78d1')).join('')+T(70+i*90,148,['F → p','2F → 2p','3F → 3p'][i],11)).join('')+T(150,12,`S bir xil: F ortsa, p ham ortadi`,12)),
f:()=>f(R(20,120,260,8,FL)+R(30,90,90,30,'#0b78d1')+R(190,30,30,90,'#0b78d1')+A(75,58,75,88)+A(205,2,205,28)+T(75,148,'S katta → p kichik',11)+T(205,148,'S kichik → p katta',11)+T(110,50,'F bir xil',11)),
g:()=>f(R(60,115,180,25,FL)+R(125,12,50,8,'#888')+R(147,20,6,78,'#aaa')+`<polygon points="147,98 153,98 150,116" fill="#aaa"/>`+A(80,30,80,80)+T(80,95,'F',13)+T(230,50,'Kichik S',12)+T(230,68,'katta p',12)+T(150,152,`O'tkir uch yog'ochga kiradi`,11)),
h:()=>f(R(20,118,260,32,'#cfe8ff')+R(60,110,180,8,'#d93c3c')+C(150,42,9,'#0b78d1')+`<g stroke="currentColor" stroke-width="3"><line x1="150" y1="51" x2="150" y2="85"/><line x1="150" y1="85" x2="138" y2="110"/><line x1="150" y1="85" x2="162" y2="110"/><line x1="150" y1="60" x2="130" y2="78"/><line x1="150" y1="60" x2="170" y2="78"/></g>`+T(150,15,`Chang'i: S katta → bosim kichik`,12)+T(150,140,`Qorga botmaydi`,11)),
i:()=>f(R(80,32,60,98,'#d93c3c')+R(180,120,60,10,'#1b9e55')+T(110,148,'Poyabzal',11)+T(210,148,`Chang'i`,11)+T(110,26,'19,6 kPa',11)+T(210,112,'1,96 kPa',11)+T(150,12,'60 kg odam: bosim qiymatlari',11)),
j:()=>f(R(20,30,125,90,BX)+T(82,60,'F ni oshirish',13)+T(82,85,'p ortadi ↑',13)+R(155,30,125,90,BX)+T(217,60,'S ni kamaytirish',13)+T(217,85,'p ortadi ↑',13)+T(150,15,`Bosimni oshirish usullari`,12)+T(150,145,`pichoq, igna, mix, bolta o'tkirlanadi`,11)),
k:()=>f(R(20,30,125,90,BX)+T(82,60,'F ni kamaytirish',13)+T(82,85,'p kamayadi ↓',13)+R(155,30,125,90,BX)+T(217,60,'S ni oshirish',13)+T(217,85,'p kamayadi ↓',13)+T(150,15,`Bosimni kamaytirish usullari`,12)+T(150,145,`chang'i, tank lentasi, keng g'ildirak`,11)),
l:()=>f(R(20,110,260,40,'#a07a4a')+R(100,30,100,60,'#0b78d1')+R(60,90,180,20,FL)+A(100,112,100,148)+A(150,112,150,148)+A(200,112,200,148)+T(150,20,`Poydevor keng: S katta, p kichik`,12)),
m:()=>f(R(20,8,260,145,BX)+T(150,32,'m = 60 kg, S = 0,03 m²',13)+T(150,60,'F = m·g = 60·9,8 = 588 N',13)+T(150,92,'p = F / S = 588 / 0,03',14)+T(150,125,'p ≈ 19 600 Pa ≈ 19,6 kPa',14)),
n:()=>f(R(20,8,260,145,BX)+T(150,32,'F = 10 N, S = 0,5 mm² = 5·10⁻⁷ m²',12)+T(150,65,'p = F / S = 10 / 5·10⁻⁷',14)+T(150,100,'p = 2·10⁷ Pa',14)+T(150,130,'= 20 MPa (juda katta!)',14)),
o:()=>f(R(20,10,260,32,'#0b78d1')+T(150,32,'p = F / S',18,'#fff')+R(20,50,125,32,BX)+T(82,71,'F = p · S',15)+R(155,50,125,32,BX)+T(217,71,'S = F / p',15)+T(150,110,`F ↑ yoki S ↓ → p ↑`,13)+T(150,135,`F ↓ yoki S ↑ → p ↓`,13))};
const S=[
[`Bosim nima?`,`<p>Kuch jismning sirtiga ta'sir qilganda, uning ta'siri faqat kuch kattaligiga emas, balki <b>kuch qo'yilgan yuzaga</b> ham bog'liq bo'ladi. Kuchning sirtga ta'sirini ifodalovchi kattalik <b>bosim</b> deyiladi. Belgisi: p.</p>`,'a'],
[`Bosim kuchi`,`<p>Sirtni unga <b>perpendikulyar</b> ravishda bosuvchi kuch <b>bosim kuchi</b> deyiladi (F). Jism gorizontal sirtda tursa, bosim kuchi jismning og'irligiga teng bo'ladi.</p>`,'b'],
[`Bosim formulasi`,`<p><b>p = F / S</b>. Bosim bosim kuchining shu kuch ta'sir qilayotgan yuzaga nisbatiga teng. Bundan: F = p·S, S = F/p.</p>`,'c'],
[`Bosim birligi`,`<p>Bosim birligi — <b>paskal (Pa)</b>: 1 Pa = 1 N/m². Katta qiymatlar uchun: 1 kPa = 1000 Pa, 1 MPa = 10⁶ Pa. Yuza m² da, kuch N da olinishi shart.</p>`,'d'],
[`Bosimning kuchga bog'liqligi`,`<p>Yuza o'zgarmasa, kuch qancha katta bo'lsa, bosim shuncha katta: kuch 2 marta ortsa, bosim ham 2 marta ortadi (<b>p ~ F</b>).</p>`,'e'],
[`Bosimning yuzaga bog'liqligi`,`<p>Kuch bir xil bo'lsa, yuza qancha kichik bo'lsa, bosim shuncha katta: yuza 2 marta kamaysa, bosim 2 marta ortadi (<b>p ~ 1/S</b>). G'isht tik turganda tuproqqa yotgandagidan ko'proq botadi.</p>`,'f'],
[`Kichik yuza — katta bosim`,`<p>Pichoq, bolta, igna, mix, qaychi uchlari juda o'tkir qilinadi: yuza kichik bo'lgani uchun oz kuch ham katta bosim hosil qiladi va jism osongina kesiladi yoki kiradi.</p>`,'g'],
[`Katta yuza — kichik bosim`,`<p>Chang'i, kamalak (tank) lentasi, qor poyabzali yuzani kattalashtiradi, shuning uchun bosim kichik bo'ladi va jism qor yoki tuproqqa botmaydi.</p>`,'h'],
[`Misol: odam va chang'i`,`<p>60 kg odam poyabzalda (S = 0,03 m²) taxminan 19,6 kPa bosim beradi, 0,3 m² li chang'ida esa atigi 1,96 kPa. Shu sababli chang'ichi qorga botmaydi.</p>`,'i'],
[`Bosimni oshirish usullari`,`<p>Bosimni oshirish uchun yoki bosim kuchini oshiramiz, yoki yuzani kamaytiramiz. Amalda ko'pincha asbobning uchi charxlanadi.</p>`,'j'],
[`Bosimni kamaytirish usullari`,`<p>Bosimni kamaytirish uchun yoki kuchni kamaytiramiz, yoki yuzani oshiramiz: keng g'ildirak, chang'i, keng tag.</p>`,'k'],
[`Qurilishda bosim`,`<p>Binolar poydevori devorlardan keng quriladi: shunda bino og'irligi katta yuzaga tarqaladi, tuproqqa bosim kamayadi va bino cho'kmaydi.</p>`,'l'],
[`Masala 1`,`<p><b>Berilgan:</b> m = 60 kg, S = 0,03 m². <b>Yechim:</b> F = m·g = 588 N; p = F/S = 588/0,03 = <b>19 600 Pa</b>.</p>`,'m'],
[`Masala 2`,`<p>Qalam (igna) uchiga F = 10 N kuch bilan bosilsa, S = 0,5 mm² = 5·10⁻⁷ m²: p = F/S = <b>2·10⁷ Pa = 20 MPa</b>. Bunday bosim qog'ozni osongina teshadi.</p>`,'n'],
[`Xulosa`,`<p>p = F/S; birligi paskal. F ortsa — p ortadi, S ortsa — p kamayadi. Kichik yuza — katta bosim (pichoq, igna), katta yuza — kichik bosim (chang'i, poydevor).</p>`,'o']];
let si=0;
function rs(){const s=S[si];$('#sl').innerHTML=`<h2>${si+1}. ${s[0]}</h2><div>${s[1]}</div><div class="fig">${FIG[s[2]]()}</div>`;$('#spg').textContent=(si+1)+' / '+S.length;[...$('#dots').children].forEach((d,i)=>d.classList.toggle('pr',i==si));if(si==S.length-1)add('sl',10)}
function go(d){si=Math.max(0,Math.min(S.length-1,si+d));rs()}
S.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>{si=i;rs()};$('#dots').append(b)});
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(cur==0){if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)}});
let tx=0;$('#s0').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#s0').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?1:-1)});
/* Canvas */
function ar(x,a,b,c,d,k){x.strokeStyle=x.fillStyle=k;x.lineWidth=5;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();const g=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-14*Math.cos(g-.4),d-14*Math.sin(g-.4));x.lineTo(c-14*Math.cos(g+.4),d-14*Math.sin(g+.4));x.fill()}
/* SIM */
const S1={d:0},S2=[0,0],B2=[0,0],S4={y:0},SAND='#e5c98a',DENT='#c9a65e';
const dp=p=>Math.min(70,Math.sqrt(p)/4);
const SM=[
{n:`p = F/S`,c:[[`F (N)`,10,1000,300,10],[`S (m²)`,.01,1,.1,.01]],d(x,t,[F,Sa],c){const p=F/Sa;S1.d+=(dp(p)-S1.d)*.08;const w=40+Sa*220,y=170+S1.d;x.fillStyle=SAND;x.fillRect(0,220,600,100);x.fillStyle=DENT;x.fillRect(300-w/2-6,220,w+12,S1.d+4);x.fillStyle='#0b78d1';x.fillRect(300-w/2,y,w,50);ar(x,300,y-20-F*.1,300,y-2,'#d93c3c');x.fillStyle=c;x.fillText(`p = ${p.toFixed(0)} Pa`,20,30);x.fillText(`F = ${F} N,  S = ${Sa} m²`,20,55);return `p = F/S = ${F} / ${Sa} = ${p.toFixed(0)} Pa`}},

{n:`Chang'i va poyabzal`,c:[[`Massa (kg)`,20,100,60,5],[`Chang'i yuzasi (m²)`,.1,.6,.3,.05]],d(x,t,[m,Sk],c){const F=m*9.8,v=[F/.03/1000,F/Sk/1000];[[`Poyabzal`],[`Chang'i`]].forEach((p,i)=>{B2[i]+=(v[i]-B2[i])*.1;const h=B2[i]*6,bx=120+i*220;x.fillStyle=v[i]>6?'#d93c3c':'#1b9e55';x.fillRect(bx,280-h,100,h);x.fillStyle=c;x.fillText(`${p[0]}: ${v[i].toFixed(1)} kPa`,bx-10,300);x.fillText(v[i]>6?'qorga botadi':'botmaydi',bx+5,270-h)});x.strokeStyle='#d93c3c';x.lineWidth=2;x.setLineDash([6,4]);x.beginPath();x.moveTo(40,244);x.lineTo(580,244);x.stroke();x.setLineDash([]);x.fillStyle=c;x.fillText('Qor chidamliligi ≈ 6 kPa',40,236);return `Poyabzalda p = ${v[0].toFixed(1)} kPa, chang'ida p = ${v[1].toFixed(1)} kPa`}},

  try {
    if (Object.prototype.hasOwnProperty.call(window, 'localStorage')) {
      delete window.localStorage;
    }
  } catch(e) {}

  function getStudent() {
    try {
      var raw = localStorage.getItem("currentStudent") || localStorage.getItem("emaktab_student");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  var hasSubmitted = false;

  async function submitTestResults(score, total) {
    if (hasSubmitted) return;
    hasSubmitted = true;

    var student = getStudent();
    var lessonTitle = document.title || document.querySelector("h1, h2, .lesson-title")?.textContent?.trim() || "7-sinf Fizika darsi";
    lessonTitle = lessonTitle.replace(/—\s*7-sinf.*$/i, '').trim();

    var record = {
      student_id: (student && student.id) ? student.id : null,
      student_name: student ? [student.first_name, student.last_name].filter(Boolean).join(" ") : "Nomaʼlum oʻquvchi",
      phone: (student && student.phone) ? student.phone : "",
      grade: "7-sinf",
      subject: "Fizika",
      lesson_title: lessonTitle,
      score: Number(score || 0),
      total_questions: Number(total || 10),
      created_at: new Date().toISOString()
    };

    var client = (window.getSupabaseClient && window.getSupabaseClient()) || window.supabaseClient;
    if (client) {
      try {
        var res = await client.from("test_results").insert([record]);
        if (res.error) {
          console.warn("[E-Maktab] Test submission error:", res.error);
        } else {
          showBadgeInTestCard("✅ Natija serverga yuborildi");
        }
      } catch(err) {
        console.warn("[E-Maktab] Test submission failed:", err);
      }
    }
  }

  function showBadgeInTestCard(msg) {
    var card = document.querySelector("#test .card, #test, #tq, main");
    if (!card) return;
    if (document.getElementById("emaktab-sync-badge")) return;
    var badge = document.createElement("div");
    badge.id = "emaktab-sync-badge";
    badge.setAttribute("style", "margin-top:14px;padding:8px 14px;background:rgba(27,158,85,0.12);border:1px solid #1b9e55;border-radius:10px;color:#1b9e55;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;");
    badge.textContent = msg;
    card.appendChild(badge);
  }

  function checkTestContainer() {
    if (hasSubmitted) return;
    var root = document.querySelector("#test, #tq, main") || document.body;
    if (!root) return;
    var text = root.innerText || root.textContent || "";

    // Pattern 1: "Siz X savoldan Y tasiga to'g'ri javob berdingiz"
    var m1 = text.match(/(\d+)\s*savoldan\s*(\d+)\s*tasiga/i);
    if (m1) {
      var total1 = parseInt(m1[1], 10);
      var score1 = parseInt(m1[2], 10);
      submitTestResults(score1, total1);
      return;
    }

    // Pattern 2: "Natija: X / Y to'g'ri"
    var m2 = text.match(/Natija:\s*(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m2) {
      var score2 = parseInt(m2[1], 10);
      var total2 = parseInt(m2[2], 10);
      submitTestResults(score2, total2);
      return;
    }

    // Pattern 3: "X / Y to'g'ri"
    var m3 = text.match(/(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m3) {
      var score3 = parseInt(m3[1], 10);
      var total3 = parseInt(m3[2], 10);
      submitTestResults(score3, total3);
      return;
    }
  }

  var observer = new MutationObserver(function() {
    checkTestContainer();
  });

  document.addEventListener("click", function(e) {
    if (e.target && (e.target.id === "qRetry" || e.target.id === "qr" || e.target.closest("#qRetry, #qr"))) {
      hasSubmitted = false;
      var b = document.getElementById("emaktab-sync-badge");
      if (b) b.remove();
    }
  });

  function startObserver() {
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    checkTestContainer();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startObserver);
  } else {
    startObserver();
  }
})();
</script>
<!-- ===== END E-MAKTAB SUPABASE TEST SYNC ===== -->
</body>
