<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fizik kattaliklar va ularning birliklari — 7-sinf fizika elektron darsi"><meta name="theme-color" content="#0b78d1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<meta name="color-scheme" content="light dark"><title>Fizik kattaliklar va ularning birliklari — 7-sinf</title>
<style>
:root{--bg:#eef5fb;--cd:#fff;--tx:#12263a;--mut:#53708a;--ac:#0b78d1;--ac2:#19b5c9;--ac3:#e8f3fd;--ok:#1b9e55;--no:#d93c3c;--bd:#cfe0ef;--gl:rgba(255,255,255,.62);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-t=night]{--bg:#0a1724;--cd:#132536;--tx:#e8f1fa;--mut:#8ea8c0;--ac:#4fb0ff;--ac2:#35d0cf;--ac3:#1c3448;--bd:#294258;--gl:rgba(20,34,50,.62)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.6 system-ui,sans-serif;color:var(--tx);background:
radial-gradient(700px 500px at 10% -10%,rgba(11,120,209,.18),transparent 60%),
radial-gradient(600px 460px at 100% 0%,rgba(25,181,201,.16),transparent 60%),var(--bg)}
button,select,input{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
header{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0;flex:1 1 auto}
.stat{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
.stat b{color:var(--tx)}
#tgl{border:1px solid var(--bd);background:var(--ac3);border-radius:10px;min-height:38px;padding:0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:52px;z-index:8;background:var(--bg);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;flex:none;min-height:44px;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(10px);color:var(--tx);padding:8px 16px;border-radius:12px}
nav button.on{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
main{max-width:980px;margin:0 auto;padding:4px 16px 70px}
section{display:none}section.on{display:block;animation:pop .35s}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.card{background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(11,70,120,.1)}
.hd{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;padding:12px 16px;border-radius:14px;margin-bottom:14px}
.hd .nb{background:rgba(255,255,255,.25);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex:none;font-weight:800}
.hd h2{margin:0;font-size:18px}
canvas{width:100%;max-width:640px;background:var(--ac3);border-radius:14px;display:block;margin:8px auto;touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--bd);background:var(--ac3);color:var(--tx);border-radius:12px;min-height:44px;padding:0 16px;font-weight:600}
.btn.p{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border:0}
.btn.ok{background:var(--ok)!important;color:#fff;border:0}.btn.no{background:var(--no)!important;color:#fff;border:0}
input[type=range]{flex:1;min-width:120px}
.f{background:var(--ac3);border-left:5px solid var(--ac);padding:10px 14px;border-radius:8px;font:700 18px ui-monospace,monospace;margin:8px 0}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bd);cursor:pointer}
.dots i.cur{background:var(--ac);transform:scale(1.4)}
.pr{height:7px;background:var(--bd);border-radius:5px;overflow:hidden}.pr i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.sv svg{width:100%;height:auto}.sv text{fill:var(--tx);font:13px sans-serif}
.gc{background:var(--ac3);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:left;min-height:46px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;white-space:normal}
small.m{color:var(--mut);display:block;margin-top:6px}
@media(max-width:700px){h1{font-size:15px}.hd h2{font-size:16px}.card{padding:13px}canvas{border-radius:10px}}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#vrw:fullscreen,#vrw.fs{background:var(--bg);padding:12px;overflow:auto}
#vrw.fs{position:fixed;inset:0;z-index:50}
#vrw:fullscreen canvas,#vrw.fs canvas{max-width:min(100%,110vh)}
.sv{margin-top:8px}
.sel{min-height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--ac3);color:var(--tx);padding:0 8px;max-width:100%}
label{display:inline-flex;gap:6px;align-items:center;font-size:14px;flex-wrap:wrap}
</style></head>
<body>
<header><h1>📐 Fizik kattaliklar va ularning birliklari</h1>
<div class="stat"><span>⭐ <b id="hStar">0</b></span><span>🏆 <b id="hScore">0</b></span><span>⏱ <b id="hTime">00:00</b></span></div>
<button id="tgl">🌓</button></header>
<nav id="nv"></nav>
<main>
<section id="slides"></section>
<section id="sim">
 <div class="hd"><span class="nb">2</span><h2>Simulyatsiyalar</h2></div>
 <div class="row" id="sn" style="margin-bottom:10px"></div>
 <canvas id="c1" width="640" height="320"></canvas>
 <div class="row" id="simc"></div>
 <div class="f" id="so"></div><small class="m" id="sh"></small>
</section>
<section id="vr">
 <div class="hd"><span class="nb">3</span><h2>VR laboratoriya: oʻlchov asboblari</h2></div>
 <div id="vrw"><canvas id="cvr" width="640" height="420"></canvas>
 <div class="row"><button class="btn" id="vra">⟳ Avto-aylanish: ha</button><label>Masshtab <input type="range" id="vrz" min="0.6" max="1.8" step="0.1" value="1"></label>
 <label>Yuk massasi: <b id="vrlv">4</b> kg <input type="range" id="vrl" min="1" max="10" step="0.5" value="4"></label>
 <button class="btn" id="vrrs">↺ Tiklash</button><button class="btn" id="vrfs">⛶ Toʻliq ekran</button></div>
 <p class="f" id="vri">Sahnani aylantiring, asbobni bosib kattalik va birligini bilib oling.</p></div>
</section>
<section id="video">
 <div class="hd"><span class="nb">4</span><h2>Video-dars: kattalik, birlik, tezlik</h2></div>
 <canvas id="cvd" width="640" height="300"></canvas>
 <p id="vdcap" class="f">Boshlash uchun ▶ tugmasini bosing</p>
 <div class="row"><button class="btn p" id="vdp">▶ Ishga tushirish</button><button class="btn" id="vds">⏸ Pauza</button><button class="btn" id="vdr">↺ Qaytadan</button>
 <label><input type="checkbox" id="vsnd"> 🔊 Ovozli sharh</label></div>
 <div class="row"><input id="vseek" type="range" min="0" max="40" step="0.1" value="0"></div>
</section>
<section id="test"></section>
<section id="games"></section>
</main>
<script>
const $=id=>document.getElementById(id);
const ST={score:0,done:{},t0:Date.now(),elapsed:0};
try{Object.assign(ST,JSON.parse(localStorage.getItem('kat_v1')||'{}'))}catch(e){}
function saveST(){try{localStorage.setItem('kat_v1',JSON.stringify({score:ST.score,done:ST.done,elapsed:ST.elapsed}))}catch(e){}}
function addScore(n){ST.score+=n;if(ST.score<0)ST.score=0;hud()}
function hud(){$('hScore').textContent=ST.score;$('hStar').textContent='★'.repeat(Math.min(5,Math.floor(ST.score/30)))||'0';$('hTime').textContent=fmt(ST.elapsed)}
function fmt(s){s|=0;return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(()=>{ST.elapsed=(Date.now()-ST.t0)/1000;hud();if(ST.elapsed%5<1)saveST()},1000);

/* tungi rejim */
if(localStorage.getItem('kat_theme')=='night')document.documentElement.dataset.t='night';
$('tgl').onclick=()=>{const d=document.documentElement;d.dataset.t=d.dataset.t=='night'?'':'night';localStorage.setItem('kat_theme',d.dataset.t)};

/* navigatsiya */
const TABS=[['slides','📑 Slaydlar'],['sim','🧪 Simulyatsiya'],['vr','🥽 VR lab'],['video','🎬 Video'],['test','📝 Test'],['games','🎮 O\'yinlar']];
TABS.forEach(([id,n],i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(id);if(i==0)b.classList.add('on');$('nv').append(b)});
function go(id){if(typeof onGo=="function")onGo(id);document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==id));[...$('nv').children].forEach((b,i)=>b.classList.toggle('on',TABS[i][0]==id))}
go('slides');

/* ========= 1) SLAYDLAR + OVOZ ========= */
let RT=.95,LG='uz-UZ',VN='',VOICES=[];const synth=window.speechSynthesis;let spkId=0;
function loadV(){try{VOICES=synth?synth.getVoices():[]}catch(e){VOICES=[]}}
if(synth){loadV();synth.onvoiceschanged=()=>{loadV();fillVoices();vNote()}}
function candV(lang){const b=lang.slice(0,2).toLowerCase();let c=VOICES.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(b));if(!c.length&&b=='uz')c=VOICES.filter(v=>/^tr/i.test(v.lang));return c}
function pickVoice(lang){const c=candV(lang);if(!c.length)return null;if(VN){const f=c.find(v=>v.name==VN);if(f)return f}
const sc=v=>(/natural|neural|online|google|microsoft|enhanced|premium|siri/i.test(v.name)?3:0)+(v.localService?0:1)+(v.lang.toLowerCase().replace('_','-')==lang.toLowerCase()?2:0);return c.slice().sort((a,b)=>sc(b)-sc(a))[0]}
function trTR(t){return t.toLowerCase().replace(/[oO]ʻ/g,'o').replace(/gʻ/g,'g').replace(/[ʻʼ’‘']/g,'').replace(/sh/g,'ş').replace(/ch/g,'ç').replace(/j/g,'c').replace(/x/g,'h').replace(/q/g,'k')}
function chunkText(t){const p=t.replace(/\s+/g,' ').trim().match(/[^.!?;:]+[.!?;:]?/g)||[t],o=[];let cur='';p.forEach(s=>{if((cur+s).length>150&&cur){o.push(cur.trim());cur=s}else cur+=s});if(cur.trim())o.push(cur.trim());return o}
function stopSpeak(){spkId++;try{synth&&synth.cancel()}catch(e){}const b=document.getElementById('rd');if(b){b.textContent='🔊 Oʻqish';b.classList.remove('p')}}
function speak(text,done){if(!synth){alert('Brauzeringiz ovozli oʻqishni qoʻllamaydi');return}
try{synth.cancel()}catch(e){}const id=++spkId,v=pickVoice(LG);let lang=v?v.lang:LG,t=text.replace(/\s+/g,' ').trim();
if(LG=='uz-UZ'&&v&&!/^uz/i.test(v.lang))t=trTR(t);else t=t.replace(/[ʻʼ’‘]/g,"'");
const ch=chunkText(t);let i=0;(function nx(){if(id!=spkId)return;if(i>=ch.length){done&&done();return}const u=new SpeechSynthesisUtterance(ch[i++]);u.lang=lang;if(v)u.voice=v;u.rate=RT;u.pitch=1;u.volume=1;u.onend=nx;u.onerror=e=>{if(id==spkId&&e.error!='canceled'&&e.error!='interrupted')nx()};synth.speak(u)})()}
function fillVoices(){const el=document.getElementById('vsel');if(!el)return;const c=candV(LG);el.innerHTML='<option value="">Avto (eng sifatli)</option>'+c.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${v.name}</option>`).join('');el.value=VN}
function vNote(){const el=document.getElementById('vnote');if(!el)return;const v=pickVoice(LG);el.textContent=!synth?'Brauzer ovozni qoʻllamaydi.':!v?'Bu til uchun ovoz topilmadi — standart ovoz ishlatiladi. Rus yoki ingliz tilini tanlab koʻring.':'Ovoz: '+v.name+' ('+v.lang+')'+(LG=='uz-UZ'&&!/^uz/i.test(v.lang)?' — oʻzbekcha ovoz yoʻq, turkcha ovoz ishlatilmoqda.':'')}
const R=a=>`<svg viewBox="0 0 400 150">${a.map((e,i)=>{const x=(i+.5)*400/a.length;return `<text x="${x}" y="70" text-anchor="middle" style="font-size:38px">${e[0]}<animate attributeName="y" values="70;58;70" dur="2s" begin="${i*.35}s" repeatCount="indefinite"/></text><text x="${x}" y="112" text-anchor="middle">${e[1]}</text>`}).join("")}</svg>`;
const LAD=(a,b)=>`<svg viewBox="0 0 400 150"><line x1="30" y1="70" x2="370" y2="70" stroke="var(--ac)" stroke-width="4"/>${a.map((q,i)=>`<circle cx="${60+i*95}" cy="70" r="9" fill="var(--ac2)"><animate attributeName="r" values="7;12;7" dur="2s" begin="${i*.4}s" repeatCount="indefinite"/></circle><text x="${60+i*95}" y="45" text-anchor="middle" style="font-size:18px;font-weight:700">${q[0]}</text><text x="${60+i*95}" y="108" text-anchor="middle">${q[1]}</text>`).join("")}<text x="200" y="138" text-anchor="middle">${b}</text></svg>`;
const FIG={
f1:()=>R([["📏","uzunlik, l"],["⚖️","massa, m"],["⏱️","vaqt, t"],["🌡️","harorat, T"]]),
f2:()=>`<svg viewBox="0 0 400 150"><text x="100" y="24" text-anchor="middle" style="font-weight:700">Vektor: tezlik</text><g><animateTransform attributeName="transform" type="translate" values="-30 0;30 0;-30 0" dur="3s" repeatCount="indefinite"/><line x1="60" y1="70" x2="130" y2="70" stroke="var(--no)" stroke-width="6"/><polygon points="130,58 152,70 130,82" fill="var(--no)"/></g><text x="100" y="115" text-anchor="middle">v = 5 m/s, →</text><line x1="200" y1="20" x2="200" y2="130" stroke="var(--bd)" stroke-width="2"/><text x="300" y="24" text-anchor="middle" style="font-weight:700">Skalyar: massa</text><text x="300" y="80" text-anchor="middle" style="font-size:34px">3 kg<animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></text><text x="300" y="115" text-anchor="middle">yoʻnalishi yoʻq</text></svg>`,
f3:()=>R([["📏","uzunlik — metr"],["⚖️","massa — kilogramm"],["⏱️","vaqt — sekund"]]),
f4:()=>R([["m","metr"],["kg","kilogramm"],["s","sekund"],["N","nyuton"]]).replace(/style="font-size:38px"/g,'style="font-size:30px;font-weight:800"'),
f5:()=>LAD([["1 mm","0,001 m"],["1 sm","0,01 m"],["1 m","1 m"],["1 km","1000 m"]],"1 km = 1000 m, 1 m = 100 sm, 1 sm = 10 mm"),
f6:()=>`<svg viewBox="0 0 400 150"><polygon points="200,58 184,138 216,138" fill="var(--ac)"/><g><animateTransform attributeName="transform" type="rotate" values="-7 200 58;7 200 58;-7 200 58" dur="4s" repeatCount="indefinite"/><rect x="50" y="54" width="300" height="8" rx="4" fill="var(--tx)"/><line x1="60" y1="62" x2="60" y2="96" stroke="var(--tx)"/><line x1="340" y1="62" x2="340" y2="96" stroke="var(--tx)"/><rect x="30" y="96" width="60" height="8" rx="4" fill="var(--ac2)"/><rect x="310" y="96" width="60" height="8" rx="4" fill="var(--ac2)"/><text x="60" y="90" text-anchor="middle">1 kg</text><text x="340" y="90" text-anchor="middle">1000 g</text></g><text x="200" y="20" text-anchor="middle">1 kg = 1000 g · 1 t = 1000 kg</text></svg>`,
f7:()=>`<svg viewBox="0 0 400 150"><circle cx="110" cy="75" r="58" fill="var(--ac3)" stroke="var(--ac)" stroke-width="4"/>${Array.from({length:12},(_,i)=>`<line x1="110" y1="22" x2="110" y2="${i%3?28:32}" stroke="var(--tx)" stroke-width="2" transform="rotate(${i*30} 110 75)"/>`).join("")}<line x1="110" y1="75" x2="110" y2="36" stroke="var(--no)" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 110 75" to="360 110 75" dur="6s" repeatCount="indefinite"/></line><line x1="110" y1="75" x2="110" y2="48" stroke="var(--tx)" stroke-width="4"><animateTransform attributeName="transform" type="rotate" from="0 110 75" to="360 110 75" dur="72s" repeatCount="indefinite"/></line><text x="270" y="55" text-anchor="middle">60 s = 1 min</text><text x="270" y="85" text-anchor="middle">60 min = 1 soat</text><text x="270" y="115" text-anchor="middle">24 soat = 1 sutka</text></svg>`,
f8:()=>`<svg viewBox="0 0 400 150">${[["kilo","×1000"],["gekto","×100"],["santi","×0,01"],["milli","×0,001"]].map((a,i)=>`<rect x="${10+i*98}" y="40" width="88" height="62" rx="12" fill="var(--ac)"><animate attributeName="opacity" values="1;.55;1" dur="2.4s" begin="${i*.4}s" repeatCount="indefinite"/></rect><text x="${54+i*98}" y="68" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:16px">${a[0]}</text><text x="${54+i*98}" y="90" text-anchor="middle" style="fill:#fff">${a[1]}</text>`).join("")}<text x="200" y="135" text-anchor="middle">Qoʻshimchalar birlik nomi oldiga qoʻshiladi</text></svg>`,
f9:()=>`<svg viewBox="0 0 400 150"><rect x="20" y="45" width="100" height="50" rx="12" fill="var(--ac3)" stroke="var(--ac)" stroke-width="3"/><text x="70" y="77" text-anchor="middle" style="font-size:20px;font-weight:700">2,5 km</text><rect x="280" y="45" width="100" height="50" rx="12" fill="var(--ac3)" stroke="var(--ok)" stroke-width="3"/><text x="330" y="77" text-anchor="middle" style="font-size:20px;font-weight:700">2500 m</text><line x1="125" y1="70" x2="275" y2="70" stroke="var(--tx)" stroke-width="3"/><polygon points="275,62 290,70 275,78" fill="var(--tx)"/><circle r="6" fill="var(--no)" cy="70"><animate attributeName="cx" values="125;275;125" dur="3s" repeatCount="indefinite"/></circle><text x="200" y="55" text-anchor="middle" style="font-weight:700">× 1000</text><text x="200" y="125" text-anchor="middle">katta birlikdan kichigiga — koʻpaytiramiz</text></svg>`,
f10:()=>`<svg viewBox="0 0 400 150"><polygon points="60,50 140,50 140,130 60,130" fill="var(--ac)" opacity=".85"/><polygon points="60,50 90,25 170,25 140,50" fill="var(--ac2)"><animate attributeName="opacity" values="1;.5;1" dur="2s" repeatCount="indefinite"/></polygon><polygon points="140,50 170,25 170,105 140,130" fill="var(--ac)" opacity=".6"/><text x="100" y="146" text-anchor="middle">1 m³</text><polygon points="270,90 310,90 310,130 270,130" fill="var(--ac2)"/><polygon points="270,90 285,77 325,77 310,90" fill="var(--ac)"/><polygon points="310,90 325,77 325,117 310,130" fill="var(--ac)" opacity=".6"/><text x="298" y="146" text-anchor="middle">1 litr = 1 dm³</text><text x="215" y="85" text-anchor="middle" style="font-size:22px">=</text><text x="215" y="40" text-anchor="middle">1000 litr</text></svg>`,
f11:()=>`<svg viewBox="0 0 400 150">${[["Yogʻoch",500],["Suv",1000],["Temir",7800],["Mis",8900]].map((a,i)=>{const h=a[1]/8900*90;return `<rect x="${40+i*90}" y="${120-h}" width="50" height="${h}" rx="6" fill="${i==1?'var(--ac2)':'var(--ac)'}"><animate attributeName="height" from="0" to="${h}" dur="1.6s" fill="freeze"/><animate attributeName="y" from="120" to="${120-h}" dur="1.6s" fill="freeze"/></rect><text x="${65+i*90}" y="136" text-anchor="middle">${a[0]}</text><text x="${65+i*90}" y="${114-h}" text-anchor="middle">${a[1]}</text>`}).join("")}<text x="200" y="14" text-anchor="middle">Zichlik ρ, kg/m³</text></svg>`,
f12:()=>`<svg viewBox="0 0 400 150"><line x1="20" y1="100" x2="380" y2="100" stroke="var(--bd)" stroke-width="5"/><text x="20" y="98" style="font-size:34px">🚗<animate attributeName="x" values="20;320;320" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/></text><text x="372" y="95" style="font-size:26px">🏁</text><text x="200" y="26" text-anchor="middle" style="font-size:20px;font-weight:700">v = s / t</text><text x="200" y="56" text-anchor="middle">s = 100 m, t = 10 s → v = 10 m/s = 36 km/soat</text><text x="200" y="135" text-anchor="middle">1 m/s = 3,6 km/soat</text></svg>`,

const S=[
["Fizik kattalik nima?",`<p>Jism yoki hodisaning oʻlchash va son bilan ifodalash mumkin boʻlgan xossasi <b>fizik kattalik</b> deyiladi. Masalan: uzunlik, massa, vaqt, tezlik, hajm.</p><p>Har bir kattalik <b>son qiymati</b> va <b>oʻlchov birligi</b>dan iborat.</p><div class='f' data-say='l teng besh metr'>l = 5 m</div>`,"f1"],

["Asosiy kattaliklar",`<p>Mexanikada uchta asosiy kattalik bor: <b>uzunlik</b>, <b>massa</b> va <b>vaqt</b>. Boshqa kattaliklar ular orqali ifodalanadi.</p><ul><li>Uzunlik — l, birligi metr</li><li>Massa — m, birligi kilogramm</li><li>Vaqt — t, birligi sekund</li></ul>`,"f3"],
["Xalqaro birliklar sistemasi (SI)",`<p>Hamma joyda bir xil oʻlchash uchun <b>Xalqaro birliklar sistemasi — SI</b> qabul qilingan. Unda uzunlik <b>metr</b>, massa <b>kilogramm</b>, vaqt <b>sekund</b>, kuch esa <b>nyuton</b> bilan oʻlchanadi.</p>`,"f4"],
["Uzunlik",`<p>Uzunlik birligi — <b>metr</b>. Katta va kichik masofalar uchun karrali birliklar ishlatiladi.</p><div class='f' data-say='bir kilometr ming metrga teng. bir metr yuz santimetrga teng. bir santimetr o‘n millimetrga teng'>1 km = 1000 m<br>1 m = 100 sm<br>1 sm = 10 mm</div>`,"f5"],
["Massa",`<p>Massa jismning inertlik va ogʻirlik xossasini ifodalaydi. Birligi — <b>kilogramm</b>. Tarozi bilan oʻlchanadi.</p><div class='f' data-say='bir tonna ming kilogrammga teng. bir kilogramm ming grammga teng'>1 t = 1000 kg<br>1 kg = 1000 g</div>`,"f6"],
["Vaqt",`<p>Vaqt birligi — <b>sekund</b>. Sekundomer va soat bilan oʻlchanadi.</p><div class='f' data-say='bir minut oltmish sekund. bir soat oltmish minut, ya’ni uch ming olti yuz sekund'>1 min = 60 s<br>1 soat = 60 min = 3600 s</div>`,"f7"],
["Karrali va ulushli birliklar",`<p>Birlik nomiga qoʻshimcha qoʻshib, katta yoki kichik birlik hosil qilinadi:</p><ul><li><b>kilo</b> — 1000 marta katta</li><li><b>gekto</b> — 100 marta katta</li><li><b>santi</b> — 100 marta kichik</li><li><b>milli</b> — 1000 marta kichik</li></ul>`,"f8"],
["Birliklarni almashtirish",`<p>Katta birlikdan kichigiga oʻtganda <b>koʻpaytiramiz</b>, kichikdan kattasiga oʻtganda <b>boʻlamiz</b>.</p><div class='f' data-say='ikki butun besh kilometr teng ikki ming besh yuz metr. uch yuz ellik gramm teng nol butun o‘ttiz besh yuzdan kilogramm. to‘qson minut teng bir butun besh o‘ndan soat'>2,5 km = 2500 m<br>350 g = 0,35 kg<br>90 min = 1,5 soat</div>`,"f9"],
["Yuza va hajm",`<p><b>Yuza</b> kvadrat metrda, <b>hajm</b> kub metrda oʻlchanadi. Toʻgʻri toʻrtburchak shaklidagi jismning hajmi uning uzunligi, eni va balandligi koʻpaytmasiga teng.</p><div class='f' data-say='V teng a koʻpaytirish b koʻpaytirish se. bir litr teng bir kub desimetr. bir kub metr ming litrga teng'>V = a·b·c<br>1 litr = 1 dm³<br>1 m³ = 1000 litr</div>`,"f10"],
["Zichlik",`<p><b>Zichlik</b> — moddaning birlik hajmining massasi. Birligi — kilogramm taqsim kub metr.</p><div class='f' data-say='ro teng m boʻlingan V'>ρ = m / V</div><p>Suvning zichligi 1000, temirniki 7800 kilogramm taqsim kub metr. Zichligi suvnikidan kichik jismlar suvda suzadi.</p>`,"f11"],
["Tezlik",`<p><b>Tezlik</b> — jism birlik vaqtda bosib oʻtgan yoʻl. Birligi — metr taqsim sekund yoki kilometr taqsim soat.</p><div class='f' data-say='v teng s boʻlingan t. bir metr sekundiga teng uch butun olti o‘ndan kilometr soatiga'>v = s / t<br>1 m/s = 3,6 km/soat</div><p>Masala: 100 metr yoʻlni 10 sekundda bosib oʻtgan jismning tezligi 10 metr taqsim sekund, ya’ni 36 kilometr taqsim soat.</p>`,"f12"],
["Kuch va ogʻirlik kuchi",`<p><b>Kuch</b> birligi — <b>nyuton</b>. Kuchni dinamometr oʻlchaydi. Jismning Yerga tortilish kuchi — ogʻirlik kuchi:</p><div class='f' data-say='F teng m koʻpaytirish g'>F = m · g</div><p>Bu yerda g taxminan 9,8 nyuton taqsim kilogramm. 1 kilogramm massali jismga taxminan 9,8 nyuton kuch taʼsir qiladi.</p>`,"f13"],
["Hosilaviy birliklar",`<p>Asosiy birliklardan <b>hosilaviy birliklar</b> hosil boʻladi:</p><ul><li>Yuza — kvadrat metr</li><li>Hajm — kub metr</li><li>Tezlik — metr taqsim sekund</li><li>Zichlik — kilogramm taqsim kub metr</li><li>Kuch — nyuton</li></ul>`,"f14"],
["Xulosa",`<ul><li>Fizik kattalik = son qiymat + oʻlchov birligi</li><li>SI asosiy birliklari: metr, kilogramm, sekund</li><li>Birliklarni almashtirishni bilish muhim</li><li>Tezlik, zichlik, kuch — hosilaviy kattaliklar</li></ul><p>Endi simulyatsiya, VR, video, test va oʻyinlarda mustahkamlang! 🚀</p>`,"f15"]];

function gQuiz(el,qs){let i=0,sc=0;(function r(){if(i>=qs.length){el.innerHTML=`<div class="f">Natija: ${sc}/${qs.length} toʻgʻri! ${"★".repeat(Math.round(sc/qs.length*5))}</div><button class="btn p" id="gqr">↺ Qaytadan</button>`;$('gqr').onclick=()=>{i=0;sc=0;r()};return}
const q=qs[i];el.innerHTML=`<p style="font-size:18px;font-weight:600">${i+1}/${qs.length}. ${q[0]}</p><div id="gqo"></div><p class="f" id="gqf" style="display:none"></p>`;const w=$('gqo');
q[1].forEach((o,j)=>{const b=document.createElement('button');b.className='btn opt';b.textContent=o;b.onclick=()=>{[...w.children].forEach(x=>x.disabled=true);const ok=j==q[2];b.classList.add(ok?'ok':'no');if(!ok)w.children[q[2]].classList.add('ok');if(ok){sc++;addScore(5)}$('gqf').style.display='block';$('gqf').textContent=(ok?'✅ ':'❌ ')+q[3];const n=document.createElement('button');n.className='btn p';n.textContent='Keyingi ▶';n.onclick=()=>{i++;r()};el.append(n)};w.append(b)})})()}
function gMatch(el){const P=[["Uzunlik","metr (m)"],["Massa","kilogramm (kg)"],["Vaqt","sekund (s)"],["Kuch","nyuton (N)"],["Hajm","kub metr (m³)"]];let a=null,ok=0;
el.innerHTML=`<p>Avval kattalikni, keyin uning birligini bosing.</p><div class="grid" id="ml"></div><br><div class="grid" id="mr"></div><p class="f" id="mf" style="display:none">🎉 Barcha juftlar topildi!</p>`;
const mk=(box,arr,side)=>arr.forEach(([t,i])=>{const b=document.createElement('button');b.className='btn gc';b.textContent=t;b.onclick=()=>{if(b.disabled)return;if(!side){box.querySelectorAll('button').forEach(x=>x.classList.remove('p'));b.classList.add('p');a={b,i}}else if(a){if(a.i==i){a.b.classList.remove('p');[a.b,b].forEach(x=>{x.classList.add('ok');x.disabled=true});a=null;addScore(5);if(++ok==P.length)$('mf').style.display='block'}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),500)}}};box.append(b)});
mk($('ml'),P.map((p,i)=>[p[0],i]),0);mk($('mr'),P.map((p,i)=>[p[1],i]).sort(()=>Math.random()-.5),1)}
function gSort(el){const St=["millimetr","santimetr","desimetr","metr","kilometr"];let n=0;el.innerHTML=`<p>Uzunlik birliklarini <b>kichikdan kattaga</b> tartiblab bosing:</p><div class="grid" id="so2"></div><p class="f" id="sf" style="display:none">🎉 Toʻgʻri tartib!</p>`;
St.slice().sort(()=>Math.random()-.5).forEach(t=>{const b=document.createElement('button');b.className='btn gc';b.textContent=t;b.onclick=()=>{if(b.disabled)return;if(St[n]==t){n++;b.disabled=true;b.classList.add('ok');b.textContent=n+". "+t;if(n==St.length){$('sf').style.display='block';addScore(10)}}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),500)}};$('so2').append(b)})}
function gMem(el){const P=[["Uzunlik","metr"],["Massa","kilogramm"],["Vaqt","sekund"],["Kuch","nyuton"],["Tezlik","m/s"],["Hajm","m³"]],C=[];P.forEach((p,i)=>{C.push([p[0],i]);C.push([p[1],i])});C.sort(()=>Math.random()-.5);let a=null,lock=false,f=0,m=0;
el.innerHTML=`<p>Kattalik va uning birligini juftlang.</p><div class="grid" id="mg" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))"></div><p class="f" id="mm" style="display:none"></p>`;
C.forEach(([t,i])=>{const b=document.createElement('button');b.className='btn gc';b.style.cssText='text-align:center;font-size:17px';b.textContent='❔';b.onclick=()=>{if(lock||b.disabled||(a&&a.b===b))return;b.textContent=t;b.classList.add('p');if(!a){a={b,i};return}f++;if(a.i==i){[a.b,b].forEach(x=>{x.classList.remove('p');x.classList.add('ok');x.disabled=true});a=null;if(++m==P.length){$('mm').style.display='block';$('mm').textContent='🎉 '+f+' urinishda topdingiz!';addScore(10)}}else{lock=true;const x=a.b;a=null;setTimeout(()=>{[x,b].forEach(y=>{y.textContent='❔';y.classList.remove('p')});lock=false},800)}};$('mg').append(b)})}
const OGN=[['🔗 Mos keltirish',gMatch],['⚡ Rost/Yolgʻon',e=>gQuiz(e,TF)],['✏️ Boʻsh joy',e=>gQuiz(e,FB)],['🔢 Tartiblash',gSort],['🃏 Xotira',gMem],['🏆 Viktorina',e=>gQuiz(e,VQ)]];
function gSet(i){[...$('gn').children].forEach((b,j)=>b.classList.toggle('p',j==i));const e=$('gb');e.innerHTML="";OGN[i][1](e)}
OGN.forEach(([n],i)=>{const b=document.createElement('button');b.className='btn'+(i?'':' p');b.textContent=n;b.onclick=()=>gSet(i);$('gn').append(b)});

<!-- ===== E-MAKTAB SUPABASE TEST SYNC ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
(function() {
  'use strict';
  if (window.__EMAKTAB_TEST_HOOK_INJECTED__) return;
  window.__EMAKTAB_TEST_HOOK_INJECTED__ = true;

  try {
    if (Object.prototype.hasOwnProperty.call(window, 'localStorage')) {
      delete window.localStorage;
    }
  } catch(e) {}

  function getStudent() {
    try {
      var raw = localStorage.getItem("currentStudent") || localStorage.getItem("emaktab_student");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  var hasSubmitted = false;

  async function submitTestResults(score, total) {
    if (hasSubmitted) return;
    hasSubmitted = true;

    var student = getStudent();
    var lessonTitle = document.title || document.querySelector("h1, h2, .lesson-title")?.textContent?.trim() || "7-sinf Fizika darsi";
    lessonTitle = lessonTitle.replace(/—\s*7-sinf.*$/i, '').trim();

    var record = {
      student_id: (student && student.id) ? student.id : null,
      student_name: student ? [student.first_name, student.last_name].filter(Boolean).join(" ") : "Nomaʼlum oʻquvchi",
      phone: (student && student.phone) ? student.phone : "",
      grade: "7-sinf",
      subject: "Fizika",
      lesson_title: lessonTitle,
      score: Number(score || 0),
      total_questions: Number(total || 10),
      created_at: new Date().toISOString()
    };

    var client = (window.getSupabaseClient && window.getSupabaseClient()) || window.supabaseClient;
    if (client) {
      try {
        var res = await client.from("test_results").insert([record]);
        if (res.error) {
          console.warn("[E-Maktab] Test submission error:", res.error);
        } else {
          showBadgeInTestCard("✅ Natija serverga yuborildi");
        }
      } catch(err) {
        console.warn("[E-Maktab] Test submission failed:", err);
      }
    }
  }

  function showBadgeInTestCard(msg) {
    var card = document.querySelector("#test .card, #test, #tq, main");
    if (!card) return;
    if (document.getElementById("emaktab-sync-badge")) return;
    var badge = document.createElement("div");
    badge.id = "emaktab-sync-badge";
    badge.setAttribute("style", "margin-top:14px;padding:8px 14px;background:rgba(27,158,85,0.12);border:1px solid #1b9e55;border-radius:10px;color:#1b9e55;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;");
    badge.textContent = msg;
    card.appendChild(badge);
  }

  function checkTestContainer() {
    if (hasSubmitted) return;
    var root = document.querySelector("#test, #tq, main") || document.body;
    if (!root) return;
    var text = root.innerText || root.textContent || "";

    // Pattern 1: "Siz X savoldan Y tasiga to'g'ri javob berdingiz"
    var m1 = text.match(/(\d+)\s*savoldan\s*(\d+)\s*tasiga/i);
    if (m1) {
      var total1 = parseInt(m1[1], 10);
      var score1 = parseInt(m1[2], 10);
      submitTestResults(score1, total1);
      return;
    }

    // Pattern 2: "Natija: X / Y to'g'ri"
    var m2 = text.match(/Natija:\s*(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m2) {
      var score2 = parseInt(m2[1], 10);
      var total2 = parseInt(m2[2], 10);
      submitTestResults(score2, total2);
      return;
    }

    // Pattern 3: "X / Y to'g'ri"
    var m3 = text.match(/(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m3) {
      var score3 = parseInt(m3[1], 10);
      var total3 = parseInt(m3[2], 10);
      submitTestResults(score3, total3);
      return;
    }
  }

  var observer = new MutationObserver(function() {
    checkTestContainer();
  });

  document.addEventListener("click", function(e) {
    if (e.target && (e.target.id === "qRetry" || e.target.id === "qr" || e.target.closest("#qRetry, #qr"))) {
      hasSubmitted = false;
      var b = document.getElementById("emaktab-sync-badge");
      if (b) b.remove();
    }
  });

  function startObserver() {
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    checkTestContainer();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startObserver);
  } else {
    startObserver();
  }
})();
</script>
<!-- ===== END E-MAKTAB SUPABASE TEST SYNC ===== -->
</body>
</html>
