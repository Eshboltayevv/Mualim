<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arximed kuchi va jismning suzish shartlari</title>
<style>
:root{--bg:#e6f3ff;--c:#0b2a45;--cd:rgba(255,255,255,.72);--p:#0b78d1;--ok:#1b9e55;--er:#d93c3c;--bd:rgba(11,120,209,.22)}
body.dark{--bg:#0a1b2c;--c:#e8f4ff;--cd:rgba(20,45,70,.72);--bd:rgba(120,190,255,.25)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--c);padding:10px;min-height:100vh;line-height:1.5}
.w{max-width:1000px;margin:auto}
.card{background:var(--cd);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(11,120,209,.15)}
h1,h2{background:linear-gradient(120deg,#0b78d1,#19b5c9);-webkit-background-clip:text;background-clip:text;color:transparent;margin:.2em 0}
h1{font-size:1.3rem}
button,select{min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--c);padding:0 14px;font:inherit;cursor:pointer}
button.on,button.pr{background:var(--p);color:#fff;border-color:var(--p)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.er{background:var(--er);color:#fff;border-color:var(--er)}
button:disabled{opacity:1;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{display:none}.sec.on{display:block}
svg{width:100%;max-height:260px;color:var(--c)}
canvas{width:100%;height:auto;border-radius:14px;background:rgba(255,255,255,.55);touch-action:none;display:block}
body.dark canvas{background:rgba(0,0,0,.3)}
.pb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;width:0;background:linear-gradient(120deg,#0b78d1,#19b5c9);transition:width .3s}
.dot{min-height:0;width:14px;height:14px;padding:0;border-radius:50%}
label{display:block;flex:1 1 200px}
input[type=range]{width:100%;height:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 button{width:100%;margin-bottom:8px;padding:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g4 button{height:64px;padding:2px;font-size:.8rem}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 14px}
#vrw:fullscreen{background:var(--bg);overflow:auto;padding:10px}
#vrw:fullscreen canvas{max-height:60vh;object-fit:contain}
.fig{margin-top:8px}
</style></head><body><div class="w">
<div class="card"><div class="row" style="justify-content:space-between"><h1>🚢 Arximed kuchi va suzish shartlari · 7-sinf</h1><button id="th">🌓 Mavzu</button></div>
<div class="row"><b id="sc"></b><span id="stars" style="color:#f5a623;font-size:1.2rem"></span><span id="tm">⏱ 0:00</span></div><div class="pb"><i id="pb"></i></div>
<div class="row" style="margin-top:8px"><button id="spk">🔊 O'qish</button><select id="rt"><option value=".7">Sekin</option><option value="1" selected>Normal</option><option value="1.4">Tez</option></select><select id="lg"><option value="uz-UZ">O'zbek</option><option value="ru-RU">Русский</option><option value="en-US">English</option></select></div></div>
<div class="card row" id="nav"></div>

<div id="s0" class="sec card on"><div id="sl"></div><div class="row"><button id="pv">‹ Orqaga</button><button id="nx" class="pr">Oldinga ›</button><b id="spg"></b></div><div id="dots" class="row" style="margin-top:10px"></div></div>

<div id="s1" class="sec card"><div class="row" id="st"></div><canvas id="cv" width="600" height="320"></canvas><p><b id="inf"></b></p><div id="cs" class="row"></div></div>

<div id="s2" class="sec"><div id="vrw" class="card"><canvas id="vr" width="640" height="360"></canvas><p style="margin:6px 0">Sichqoncha yoki barmoq bilan sahnani aylantiring.</p>
<div class="row"><select id="vl"><option value="0">Suv (1000)</option><option value="1">Kerosin (800)</option><option value="2">Tuzli suv (1030)</option><option value="3">Simob (13 600)</option></select><select id="vo"><option value="0">Yog'och (600)</option><option value="1">Muz (900)</option><option value="2">Alyuminiy (2700)</option><option value="3">Po'lat (7800)</option></select></div>
<div class="row" style="margin-top:8px"><button id="vd" class="pr">⬇ Tushirish</button><button id="vz">⟲ Joyiga</button><button id="vs">👓 Stereo</button><button id="vf">⛶ To'liq ekran</button><button id="v0">↺ Ko'rinish</button></div></div></div>

<div id="s3" class="sec card"><canvas id="vc" width="600" height="320"></canvas><p id="sub" style="min-height:3em;font-weight:600"></p><input type="range" id="vk" min="0" max="40" step=".1" value="0"><div class="row"><button id="vpl" class="pr">▶ Play</button><button id="vpa">⏸ Pauza</button><button id="vre">↺ Qaytadan</button><b id="vtm"></b></div></div>

<div id="s4" class="sec card"><div id="tq"></div></div>
<div id="s5" class="sec card"><div class="row" id="gt"></div><div id="gm" style="margin-top:12px"></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
let st;try{st=JSON.parse(localStorage.getItem('arx7'))||{}}catch(e){st={}}
st.p=st.p||{};st.t=st.t||0;
const sv=()=>{try{localStorage.setItem('arx7',JSON.stringify(st))}catch(e){}},MAX=110;
const col=()=>document.body.classList.contains('dark')?'#e8f4ff':'#0b2a45';
function upd(){const s=Object.values(st.p).reduce((a,b)=>a+b,0),k=Math.round(s/MAX*5);$('#sc').textContent='Ball: '+s+'/'+MAX;$('#stars').textContent='★'.repeat(k)+'☆'.repeat(5-k);$('#pb').style.width=Math.min(100,s/MAX*100)+'%'}
function add(k,v){if((st.p[k]||0)<v){st.p[k]=v;sv();upd()}}
setInterval(()=>{st.t++;$('#tm').textContent='⏱ '+Math.floor(st.t/60)+':'+String(st.t%60).padStart(2,'0');if(st.t%5==0)sv()},1000);
document.body.classList.toggle('dark',!!st.d);
$('#th').onclick=()=>{st.d=!st.d;document.body.classList.toggle('dark',st.d);sv()};
let cur=0;
`📖 Slaydlar,🧪 Simulyatsiya,🥽 VR,🎬 Video,📝 Test,🎮 O'yinlar`.split(',').forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);$('#nav').append(b)});
function show(i){cur=i;for(let j=0;j<6;j++)$('#s'+j).classList.toggle('on',j==i);[...$('#nav').children].forEach((b,j)=>b.classList.toggle('on',j==i));if(i!=3)vp=false;try{speechSynthesis.cancel()}catch(e){}}
/* SVG */
const f=b=>`<svg viewBox="0 0 300 160"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#d93c3c"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#0b78d1"/></marker></defs>${b}</svg>`;
const T=(x,y,s,z=12,c='currentColor')=>`<text x="${x}" y="${y}" font-size="${z}" text-anchor="middle" fill="${c}">${s}</text>`;
const A=(a,b,c,d,k=0)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${k?'#0b78d1':'#d93c3c'}" stroke-width="3" marker-end="url(#${k?'ab':'ar'})"/>`;
const C=(x,y,r,l)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${l}"/>`;
const R=(x,y,w,h,l)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${l}"/>`;
const BX='rgba(11,120,209,.22)',WT='rgba(25,181,201,.35)';
const FIG={
a:()=>f(R(50,10,40,55,BX)+T(70,42,'5 N',14)+R(60,70,20,20,'#0b78d1')+T(70,108,'havoda',11)+R(210,10,40,55,BX)+T(230,42,'3 N',14)+R(180,95,100,55,WT)+R(220,100,20,20,'#0b78d1')+T(230,142,'suvda',11)+T(150,50,'→',22)+T(150,72,'yengillashdi',11)),
b:()=>f(R(40,45,220,95,WT)+R(120,75,60,40,'#0b78d1')+A(150,75,150,28)+T(180,40,'F_A',13)+A(150,115,150,150)+T(180,145,'mg',13)+T(150,15,`Arximed kuchi — yuqoriga yo'nalgan`,12)),
c:()=>f(R(30,50,90,80,WT)+C(75,85,16,'#0b78d1')+R(190,95,60,45,'rgba(25,181,201,.5)')+A(125,65,185,100,1)+T(75,45,'Jism botiriladi',10)+T(220,88,'siqib chiqarilgan suv',10)+T(150,152,`F_A = siqib chiqarilgan suv og'irligi`,11)),
d:()=>f(R(40,25,220,60,'#0b78d1')+T(150,67,'F_A = ρ · g · V',24,'#fff')+T(150,105,`ρ — suyuqlik zichligi (kg/m³)`,11)+T(150,122,`g ≈ 9,8 N/kg; V — botgan hajm (m³)`,11)+T(150,142,`F_A birligi — nyuton (N)`,11)),
e:()=>f(R(20,55,260,85,WT)+C(90,95,30,'#888')+C(210,95,30,'#e0a030')+A(90,65,90,28)+A(210,65,210,28)+T(120,40,'F_A',12)+T(240,40,'F_A',12)+T(90,152,'temir',11)+T(210,152,'alyuminiy',11)+T(150,12,`V bir xil → F_A bir xil`,12)),
f:()=>f(R(15,5,270,125,BX)+['Suv  1000','Kerosin  800','Tuzli suv  1030','Simob  13 600'].map((s,i)=>T(85,38+i*26,s,12)).join('')+['Muz  900',`Qarag'ay  400`,`Po'lat  7800`,'Havo  1,29'].map((s,i)=>T(215,38+i*26,s,12)).join('')+T(150,150,'ρ — zichlik, kg/m³',11)),
g:()=>f(R(40,10,40,55,BX)+T(60,42,'P',14)+R(50,70,20,20,'#0b78d1')+T(60,108,'havoda',11)+R(200,10,40,55,BX)+T(220,42,"P'",14)+R(180,95,80,45,WT)+R(210,100,20,20,'#0b78d1')+T(150,45,"P' = P − F_A",13)+T(150,75,'5 − 2 = 3 N',13)+T(220,152,'suvda',11)),
h:()=>f(R(15,30,270,105,WT)+C(60,118,14,'#444')+C(150,85,14,'#e0a030')+C(240,36,14,'#b98b5a')+T(60,14,`cho'kadi`,12)+T(150,14,'muallaq',12)+T(240,14,'suzadi',12)+T(60,152,'F_A < mg',11)+T(150,152,'F_A = mg',11)+T(240,152,'F_A = mg',11)),
i:()=>f([['>',`cho'kadi`],['=','muallaq'],['<','suzadi']].map((p,i)=>R(10+i*96,20,88,100,BX)+T(54+i*96,50,'ρ jism',12)+T(54+i*96,80,p[0],24)+T(54+i*96,102,'ρ suyuqlik',12)+T(54+i*96,148,p[1],12)).join('')+T(150,12,'Zichliklarni solishtirish',12)),
j:()=>f(R(30,70,240,75,WT)+R(110,45,80,50,'#b98b5a')+`<line x1="25" y1="70" x2="275" y2="70" stroke="currentColor" stroke-dasharray="4"/>`+T(150,18,`Suzayotgan jism: F_A = m·g`,12)+T(230,62,'havoda',10)+T(230,90,'suvda',10)+T(150,135,`botgan hajm V = m / ρ suyuqlik`,11)),
k:()=>f(`<polygon points="70,80 230,80 210,115 90,115" fill="#555"/>`+R(120,55,60,25,'#ddd')+R(20,100,260,50,WT)+T(150,20,`Kema ko'p suvni siqib chiqaradi`,12)+T(150,140,`Ichi bo'sh: o'rtacha zichlik < suv zichligi`,10)),
l:()=>f(R(10,30,280,120,'rgba(25,181,201,.3)')+`<ellipse cx="150" cy="90" rx="80" ry="28" fill="#6b7a8c"/>`+R(135,56,30,18,'#6b7a8c')+T(150,18,`Suv osti kemasi: balast sig'imlari`,12)+T(150,145,`Suv to'lsa — cho'kadi, havo to'lsa — ko'tariladi`,10,'#fff')),
m:()=>f(C(150,55,38,'#d93c3c')+`<line x1="150" y1="93" x2="150" y2="125" stroke="currentColor" stroke-width="2"/>`+R(138,125,24,16,'#8a5a2b')+A(230,70,230,25)+T(262,40,'F_A',12)+T(60,55,`ρ havo ≈`,11)+T(60,72,'1,29 kg/m³',11)+T(150,155,`Gazda ham Arximed kuchi ta'sir qiladi`,11)),
n:()=>f(R(20,8,260,145,BX)+T(150,30,`V = 0,002 m³, suv: ρ = 1000 kg/m³`,12)+T(150,58,'F_A = ρ · g · V',14)+T(150,88,'F_A = 1000 · 9,8 · 0,002',13)+T(150,122,'F_A = 19,6 N',18)),
o:()=>f(R(20,10,260,32,'#0b78d1')+T(150,32,'F_A = ρ·g·V',18,'#fff')+[['F_A < mg',`cho'kadi`],['F_A = mg','muallaq'],['F_A > mg','suzadi']].map((p,i)=>R(15+i*96,52,88,50,BX)+T(59+i*96,74,p[0],12)+T(59+i*96,94,p[1],12)).join('')+T(150,130,`ρ jism < ρ suyuqlik → jism suzadi`,12))};
const S=[
[`Suyuqlikdagi jism`,`<p>Dinamometrga osilgan jismni suvga botirsak, uning ko'rsatishi kamayadi: jism suvda <b>yengillashadi</b>. Demak, suyuqlik jismga yuqoriga yo'nalgan qo'shimcha kuch bilan ta'sir qiladi.</p>`,'a'],
[`Arximed kuchi nima?`,`<p>Suyuqlik (yoki gaz) ichiga botirilgan jismni yuqoriga itaruvchi kuch <b>Arximed kuchi</b> (itarib chiqaruvchi kuch) deyiladi. Belgisi: F<sub>A</sub>. U jismning og'irlik kuchiga qarama-qarshi, vertikal yuqoriga yo'nalgan.</p>`,'b'],
[`Arximed qonuni`,`<p>Suyuqlikka botirilgan jismga yuqoriga yo'nalgan kuch ta'sir qiladi va bu kuch <b>jism siqib chiqargan suyuqlikning og'irligiga teng</b>. Qonunni qadimgi yunon olimi Arximed kashf etgan.</p>`,'c'],
[`Arximed kuchi formulasi`,`<p><b>F<sub>A</sub> = ρ · g · V</b>, bu yerda ρ — suyuqlik zichligi, g ≈ 9,8 N/kg, V — jismning suyuqlikka botgan qismining hajmi.</p>`,'d'],
[`Nimalarga bog'liq?`,`<p>F<sub>A</sub> <b>suyuqlik zichligi</b>ga va jismning <b>botgan hajmi</b>ga bog'liq. Jismning massasi, zichligi va shakliga bog'liq emas: hajmi bir xil temir va alyuminiy sharchaga bir xil Arximed kuchi ta'sir qiladi.</p>`,'e'],
[`Zichliklar jadvali`,`<p>Zichlik ρ (kg/m³): suv — 1000, kerosin — 800, tuzli suv — 1030, simob — 13 600, muz — 900, qarag'ay — 400, po'lat — 7800, havo — 1,29.</p>`,'f'],
[`Suyuqlikdagi og'irlik`,`<p>Jismning suyuqlikdagi og'irligi: <b>P' = P − F<sub>A</sub></b>. Masalan, havoda 5 N bo'lgan jismga suvda F<sub>A</sub> = 2 N ta'sir qilsa, dinamometr 3 N ko'rsatadi.</p>`,'g'],
[`Suzish shartlari (kuchlar)`,`<p>Jismga ikki kuch ta'sir qiladi: og'irlik kuchi mg (pastga) va F<sub>A</sub> (yuqoriga). Agar <b>F<sub>A</sub> &lt; mg</b> — jism cho'kadi; <b>F<sub>A</sub> = mg</b> — suyuqlik ichida muallaq qoladi; <b>F<sub>A</sub> &gt; mg</b> — yuzaga ko'tarilib suzadi.</p>`,'h'],
[`Suzish shartlari (zichlik)`,`<p>Bir jinsli jism uchun: <b>ρ<sub>jism</sub> &gt; ρ<sub>suyuq</sub></b> — cho'kadi; <b>ρ<sub>jism</sub> = ρ<sub>suyuq</sub></b> — muallaq; <b>ρ<sub>jism</sub> &lt; ρ<sub>suyuq</sub></b> — suzadi. Muz (900) suvda (1000) suzadi, po'lat sharcha cho'kadi.</p>`,'i'],
[`Suzayotgan jism`,`<p>Suzayotgan jism uchun F<sub>A</sub> = mg. Shuning uchun jismning suyuqlikka botgan hajmi V<sub>bot</sub> = m / ρ<sub>suyuq</sub>. Suyuqlik zichligi katta bo'lsa, jism kamroq botadi.</p>`,'j'],
[`Kema nega suzadi?`,`<p>Kema po'latdan yasalgan, lekin ichi bo'sh. Uning <b>o'rtacha zichligi</b> suv zichligidan kichik va u ko'p suvni siqib chiqaradi. Kemaning suvni siqib chiqargan hajmiga mos og'irlik — <b>suv ko'chimi</b> deyiladi.</p>`,'k'],
[`Suv osti kemasi`,`<p>Suv osti kemasi balast sig'imlariga suv to'ldirib cho'kadi va suvni siqib chiqarib havo to'ldirganda yuzaga ko'tariladi: shu usulda uning o'rtacha zichligi o'zgaradi.</p>`,'l'],
[`Gazdagi Arximed kuchi`,`<p>Arximed kuchi gazlarda ham ta'sir qiladi. Havo shari yengil gaz bilan to'ldirilgani uchun F<sub>A</sub> = ρ<sub>havo</sub>·g·V uning og'irligidan katta bo'lib, uni ko'taradi. ρ<sub>havo</sub> ≈ 1,29 kg/m³.</p>`,'m'],
[`Masala`,`<p>Hajmi V = 0,002 m³ jism suvga to'liq botirilgan. F<sub>A</sub> = ρgV = 1000·9,8·0,002 = <b>19,6 N</b>.</p>`,'n'],
[`Xulosa`,`<p>F<sub>A</sub> = ρgV, yuqoriga yo'nalgan. F<sub>A</sub> &lt; mg — cho'kadi, F<sub>A</sub> = mg — muallaq, F<sub>A</sub> &gt; mg — suzadi. Kema, suv osti kemasi va havo shari shu qonunga asoslanadi.</p>`,'o']];
let si=0;
function rs(){const s=S[si];$('#sl').innerHTML=`<h2>${si+1}. ${s[0]}</h2><div>${s[1]}</div><div class="fig">${FIG[s[2]]()}</div>`;$('#spg').textContent=(si+1)+' / '+S.length;[...$('#dots').children].forEach((d,i)=>d.classList.toggle('pr',i==si));if(si==S.length-1)add('sl',10)}
function go(d){si=Math.max(0,Math.min(S.length-1,si+d));rs()}
S.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>{si=i;rs()};$('#dots').append(b)});
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(cur==0){if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)}});
let tx=0;$('#s0').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#s0').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?1:-1)});
/* Canvas */
function ar(x,a,b,c,d,k){x.strokeStyle=x.fillStyle=k;x.lineWidth=5;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();const g=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-14*Math.cos(g-.4),d-14*Math.sin(g-.4));x.lineTo(c-14*Math.cos(g+.4),d-14*Math.sin(g+.4));x.fill()}
const WA='rgba(25,181,201,.4)';
/* SIM */
const S2={y:100},S3={y:0},S4={h:0,v:0};

<!-- ===== E-MAKTAB SUPABASE TEST SYNC ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
(function() {
  'use strict';
  if (window.__EMAKTAB_TEST_HOOK_INJECTED__) return;
  window.__EMAKTAB_TEST_HOOK_INJECTED__ = true;

  try {
    if (Object.prototype.hasOwnProperty.call(window, 'localStorage')) {
      delete window.localStorage;
    }
  } catch(e) {}

  function getStudent() {
    try {
      var raw = localStorage.getItem("currentStudent") || localStorage.getItem("emaktab_student");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  var hasSubmitted = false;

  async function submitTestResults(score, total) {
    if (hasSubmitted) return;
    hasSubmitted = true;

    var student = getStudent();
    var lessonTitle = document.title || document.querySelector("h1, h2, .lesson-title")?.textContent?.trim() || "7-sinf Fizika darsi";
    lessonTitle = lessonTitle.replace(/—\s*7-sinf.*$/i, '').trim();

    var record = {
      student_id: (student && student.id) ? student.id : null,
      student_name: student ? [student.first_name, student.last_name].filter(Boolean).join(" ") : "Nomaʼlum oʻquvchi",
      phone: (student && student.phone) ? student.phone : "",
      grade: "7-sinf",
      subject: "Fizika",
      lesson_title: lessonTitle,
      score: Number(score || 0),
      total_questions: Number(total || 10),
      created_at: new Date().toISOString()
    };

    var client = (window.getSupabaseClient && window.getSupabaseClient()) || window.supabaseClient;
    if (client) {
      try {
        var res = await client.from("test_results").insert([record]);
        if (res.error) {
          console.warn("[E-Maktab] Test submission error:", res.error);
        } else {
          showBadgeInTestCard("✅ Natija serverga yuborildi");
        }
      } catch(err) {
        console.warn("[E-Maktab] Test submission failed:", err);
      }
    }
  }

  function showBadgeInTestCard(msg) {
    var card = document.querySelector("#test .card, #test, #tq, main");
    if (!card) return;
    if (document.getElementById("emaktab-sync-badge")) return;
    var badge = document.createElement("div");
    badge.id = "emaktab-sync-badge";
    badge.setAttribute("style", "margin-top:14px;padding:8px 14px;background:rgba(27,158,85,0.12);border:1px solid #1b9e55;border-radius:10px;color:#1b9e55;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;");
    badge.textContent = msg;
    card.appendChild(badge);
  }

  function checkTestContainer() {
    if (hasSubmitted) return;
    var root = document.querySelector("#test, #tq, main") || document.body;
    if (!root) return;
    var text = root.innerText || root.textContent || "";

    // Pattern 1: "Siz X savoldan Y tasiga to'g'ri javob berdingiz"
    var m1 = text.match(/(\d+)\s*savoldan\s*(\d+)\s*tasiga/i);
    if (m1) {
      var total1 = parseInt(m1[1], 10);
      var score1 = parseInt(m1[2], 10);
      submitTestResults(score1, total1);
      return;
    }

    // Pattern 2: "Natija: X / Y to'g'ri"
    var m2 = text.match(/Natija:\s*(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m2) {
      var score2 = parseInt(m2[1], 10);
      var total2 = parseInt(m2[2], 10);
      submitTestResults(score2, total2);
      return;
    }

    // Pattern 3: "X / Y to'g'ri"
    var m3 = text.match(/(\d+)\s*\/\s*(\d+)\s*to[‘'ʻ]g[‘'ʻ]ri/i);
    if (m3) {
      var score3 = parseInt(m3[1], 10);
      var total3 = parseInt(m3[2], 10);
      submitTestResults(score3, total3);
      return;
    }
  }

  var observer = new MutationObserver(function() {
    checkTestContainer();
  });

  document.addEventListener("click", function(e) {
    if (e.target && (e.target.id === "qRetry" || e.target.id === "qr" || e.target.closest("#qRetry, #qr"))) {
      hasSubmitted = false;
      var b = document.getElementById("emaktab-sync-badge");
      if (b) b.remove();
    }
  });

  function startObserver() {
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    checkTestContainer();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startObserver);
  } else {
    startObserver();
  }
})();
</script>
<!-- ===== END E-MAKTAB SUPABASE TEST SYNC ===== -->
</body>
