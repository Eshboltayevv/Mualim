<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quvvat va uning birliklari</title>
<style>
:root{--bg:#e6f3ff;--c:#0b2a45;--cd:rgba(255,255,255,.72);--p:#0b78d1;--ok:#1b9e55;--er:#d93c3c;--bd:rgba(11,120,209,.22)}
body.dark{--bg:#0a1b2c;--c:#e8f4ff;--cd:rgba(20,45,70,.72);--bd:rgba(120,190,255,.25)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--c);padding:10px;min-height:100vh;line-height:1.5}
.w{max-width:1000px;margin:auto}
.card{background:var(--cd);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(11,120,209,.15)}
h1,h2{background:linear-gradient(120deg,#0b78d1,#19b5c9);-webkit-background-clip:text;background-clip:text;color:transparent;margin:.2em 0}
h1{font-size:1.3rem}
button,select{min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--c);padding:0 14px;font:inherit;cursor:pointer}
button.on,button.pr{background:var(--p);color:#fff;border-color:var(--p)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.er{background:var(--er);color:#fff;border-color:var(--er)}
button:disabled{opacity:1;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{display:none}.sec.on{display:block}
svg{width:100%;max-height:260px;color:var(--c)}
canvas{width:100%;height:auto;border-radius:14px;background:rgba(255,255,255,.55);touch-action:none;display:block}
body.dark canvas{background:rgba(0,0,0,.3)}
.pb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;width:0;background:linear-gradient(120deg,#0b78d1,#19b5c9);transition:width .3s}
.dot{min-height:0;width:14px;height:14px;padding:0;border-radius:50%}
label{display:block;flex:1 1 200px}
input[type=range]{width:100%;height:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 button{width:100%;margin-bottom:8px;padding:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g4 button{height:64px;padding:2px;font-size:.8rem}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 14px}
#vrw:fullscreen{background:var(--bg);overflow:auto;padding:10px}
#vrw:fullscreen canvas{max-height:60vh;object-fit:contain}
.fig{margin-top:8px}
</style></head><body><div class="w">
<div class="card"><div class="row" style="justify-content:space-between"><h1>⚡ Quvvat va uning birliklari · 7-sinf</h1><button id="th">🌓 Mavzu</button></div>
<div class="row"><b id="sc"></b><span id="stars" style="color:#f5a623;font-size:1.2rem"></span><span id="tm">⏱ 0:00</span></div><div class="pb"><i id="pb"></i></div>
<div class="row" style="margin-top:8px"><button id="spk">🔊 O'qish</button><select id="rt"><option value=".7">Sekin</option><option value="1" selected>Normal</option><option value="1.4">Tez</option></select><select id="lg"><option value="uz-UZ">O'zbek</option><option value="ru-RU">Русский</option><option value="en-US">English</option></select></div></div>
<div class="card row" id="nav"></div>

<div id="s0" class="sec card on"><div id="sl"></div><div class="row"><button id="pv">‹ Orqaga</button><button id="nx" class="pr">Oldinga ›</button><b id="spg"></b></div><div id="dots" class="row" style="margin-top:10px"></div></div>

<div id="s1" class="sec card"><div class="row" id="st"></div><canvas id="cv" width="600" height="320"></canvas><p><b id="inf"></b></p><div id="cs" class="row"></div></div>

<div id="s2" class="sec"><div id="vrw" class="card"><canvas id="vr" width="640" height="360"></canvas><p style="margin:6px 0">Sichqoncha yoki barmoq bilan sahnani aylantiring.</p>
<div class="row"><label>Yuk massasi: <b id="vmo">50</b> kg<input type="range" id="vm" min="20" max="100" step="10" value="50"></label><select id="vo"><option value="0">Motor 100 W</option><option value="1">Motor 200 W</option><option value="2" selected>Motor 400 W</option><option value="3">Motor 800 W</option></select></div>
<div class="row" style="margin-top:8px"><button id="vd" class="pr">⬆ Ko'tarish</button><button id="vz">⟲ Pastga</button><button id="vs">👓 Stereo</button><button id="vf">⛶ To'liq ekran</button><button id="v0">↺ Ko'rinish</button></div></div></div>

<div id="s3" class="sec card"><canvas id="vc" width="600" height="320"></canvas><p id="sub" style="min-height:3em;font-weight:600"></p><input type="range" id="vk" min="0" max="40" step=".1" value="0"><div class="row"><button id="vpl" class="pr">▶ Play</button><button id="vpa">⏸ Pauza</button><button id="vre">↺ Qaytadan</button><b id="vtm"></b></div></div>

<div id="s4" class="sec card"><div id="tq"></div></div>
<div id="s5" class="sec card"><div class="row" id="gt"></div><div id="gm" style="margin-top:12px"></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
let st;try{st=JSON.parse(localStorage.getItem('qvt7'))||{}}catch(e){st={}}
st.p=st.p||{};st.t=st.t||0;
const sv=()=>{try{localStorage.setItem('qvt7',JSON.stringify(st))}catch(e){}},MAX=110;
const col=()=>document.body.classList.contains('dark')?'#e8f4ff':'#0b2a45';
function upd(){const s=Object.values(st.p).reduce((a,b)=>a+b,0),k=Math.round(s/MAX*5);$('#sc').textContent='Ball: '+s+'/'+MAX;$('#stars').textContent='★'.repeat(k)+'☆'.repeat(5-k);$('#pb').style.width=Math.min(100,s/MAX*100)+'%'}
function add(k,v){if((st.p[k]||0)<v){st.p[k]=v;sv();upd()}}
setInterval(()=>{st.t++;$('#tm').textContent='⏱ '+Math.floor(st.t/60)+':'+String(st.t%60).padStart(2,'0');if(st.t%5==0)sv()},1000);
document.body.classList.toggle('dark',!!st.d);
$('#th').onclick=()=>{st.d=!st.d;document.body.classList.toggle('dark',st.d);sv()};
let cur=0;
`📖 Slaydlar,🧪 Simulyatsiya,🥽 VR,🎬 Video,📝 Test,🎮 O'yinlar`.split(',').forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);$('#nav').append(b)});
function show(i){cur=i;for(let j=0;j<6;j++)$('#s'+j).classList.toggle('on',j==i);[...$('#nav').children].forEach((b,j)=>b.classList.toggle('on',j==i));if(i!=3)vp=false;try{speechSynthesis.cancel()}catch(e){}}
/* SVG */
const f=b=>`<svg viewBox="0 0 300 160"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#d93c3c"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#0b78d1"/></marker></defs>${b}</svg>`;
const T=(x,y,s,z=12,c='currentColor')=>`<text x="${x}" y="${y}" font-size="${z}" text-anchor="middle" fill="${c}">${s}</text>`;
const A=(a,b,c,d,k=0)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${k?'#0b78d1':'#d93c3c'}" stroke-width="3" marker-end="url(#${k?'ab':'ar'})"/>`;
const C=(x,y,r,l)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${l}"/>`;
const R=(x,y,w,h,l)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${l}"/>`;
const BX='rgba(11,120,209,.22)',YL='#ffd54a';
const FIG={
a:()=>f(R(60,105,30,25,'#0b78d1')+R(210,105,30,25,'#0b78d1')+A(75,100,75,50,1)+A(225,100,225,50,1)+T(75,148,'t = 10 s',12)+T(225,148,'t = 5 s',12)+T(150,22,`Ish bir xil, vaqt har xil`,12)+T(150,75,`⇒ quvvat har xil`,13)),
b:()=>f(R(30,20,240,50,'#0b78d1')+T(150,52,'Quvvat = ish / vaqt',20,'#fff')+T(150,100,`Quvvat — ish bajarilish tezligini`,12)+T(150,118,`ko'rsatuvchi fizik kattalik`,12)+T(150,145,`Ish qancha tez bajarilsa, quvvat shuncha katta`,10)),
c:()=>f(R(50,15,200,55,'#0b78d1')+T(150,53,'N = A / t',26,'#fff')+T(150,92,'N — quvvat (W)',12)+T(150,112,'A — bajarilgan ish (J)',12)+T(150,132,'t — vaqt (s)',12)),
d:()=>f(R(20,8,260,30,BX)+T(150,28,'1 W = 1 J / 1 s',14)+R(20,44,260,30,BX)+T(150,64,'1 kW = 1000 W',14)+R(20,80,260,30,BX)+T(150,100,'1 MW = 1 000 000 W',14)+R(20,116,260,30,BX)+T(150,136,`1 o.k. ≈ 735,5 W`,14)),
e:()=>f(C(90,70,40,'rgba(255,213,74,.3)')+C(90,70,22,YL)+C(210,70,55,'rgba(255,213,74,.4)')+C(210,70,26,'#ffcc00')+T(90,135,'60 W: 60 J/s',12)+T(210,135,'100 W: 100 J/s',12)+T(150,14,`1 W — har sekundda 1 J ish`,12)),
f:()=>f(R(20,15,260,32,'#0b78d1')+T(150,37,'N = A / t',16,'#fff')+R(20,57,125,32,BX)+T(82,78,'A = N · t',15)+R(155,57,125,32,BX)+T(217,78,'t = A / N',15)+T(150,118,`Uch kattalikdan ikkitasi ma'lum bo'lsa,`,11)+T(150,136,`uchinchisini topish mumkin`,11)),
g:()=>f(R(20,8,260,145,BX)+T(150,32,'N = 200 W, A = 1000 J',13)+T(150,62,'t = A / N',15)+T(150,92,'t = 1000 / 200',14)+T(150,125,'t = 5 s',18)),
h:()=>f(R(80,85,100,32,'#0b78d1')+R(100,65,55,22,'#0b78d1')+C(105,120,12,'#333')+C(155,120,12,'#333')+A(185,100,260,100)+T(232,92,'F',13)+A(185,60,260,60,1)+T(232,52,'v',13)+T(150,148,'N = F · v',16)+R(20,128,50,6,'#667')),
i:()=>f(R(15,5,270,125,BX)+['Inson: 70–100 W','Lampochka: 60 W','Choynak: 2 kW'].map((s,i)=>T(85,40+i*38,s,11)).join('')+['Avtomobil: 70 kW','Elektrovoz: 5 MW','GES: 100 MW'].map((s,i)=>T(215,40+i*38,s,11)).join('')+T(150,150,'Turli qurilmalar quvvati',11)),
j:()=>f(R(20,8,260,145,BX)+T(150,35,'Ot kuchi (o.k.)',14)+T(150,65,'1 o.k. ≈ 735,5 W',14)+T(150,95,'1 kW ≈ 1,36 o.k.',14)+T(150,128,`Dvigatel quvvati ba'zan o.k. da beriladi`,10)),
k:()=>f(R(20,8,260,145,BX)+T(150,32,'Energiya sarfi: E = N · t',13)+T(150,62,'1 kW·soat = 1000 W · 3600 s',12)+T(150,92,'= 3 600 000 J = 3,6 MJ',14)+T(150,128,`Elektr hisoblagichlar kW·soat da hisoblaydi`,10)),
l:()=>f(R(30,125,70,10,'#555')+R(60,20,8,105,'#d9a21c')+R(60,20,150,8,'#d9a21c')+`<line x1="200" y1="28" x2="200" y2="70" stroke="currentColor" stroke-width="2"/>`+R(185,70,30,25,'#0b78d1')+A(240,95,240,45,1)+T(262,70,'h',13)+T(150,150,`Kran yukni ko'taradi: N = A / t`,11)),
m:()=>f(R(20,8,260,145,BX)+T(150,28,'m = 50 kg, h = 4 m, t = 10 s',12)+T(150,58,'A = m·g·h = 50·9,8·4 = 1960 J',12)+T(150,92,'N = A / t = 1960 / 10',13)+T(150,125,'N = 196 W',18)),
n:()=>f(R(20,8,260,145,BX)+T(150,28,'F = 2000 N, s = 12 m, t = 20 s',12)+T(150,58,'A = F·s = 2000·12 = 24 000 J',12)+T(150,92,'N = 24 000 / 20 = 1200 W',13)+T(150,125,'N = 1,2 kW',18)),
o:()=>f(R(20,10,260,32,'#0b78d1')+T(150,32,'N = A / t',18,'#fff')+R(15,52,125,32,BX)+T(77,73,'A = N·t',15)+R(160,52,125,32,BX)+T(222,73,'N = F·v',15)+T(150,112,'1 W = 1 J/s;  1 kW = 1000 W',13)+T(150,138,'1 kW·soat = 3,6 MJ',13))};
const S=[
[`Ish bir xil, vaqt har xil`,`<p>Ikki kishi bir xil yukni bir xil balandlikka ko'tarsa, ikkalasi ham bir xil ish bajaradi. Lekin biri buni 10 s da, ikkinchisi 5 s da bajarishi mumkin. Ularning ish bajarish <b>tezligi</b> har xil.</p>`,'a'],
[`Quvvat nima?`,`<p><b>Quvvat</b> — ishning bajarilish tezligini ko'rsatuvchi fizik kattalik. U bajarilgan ishning shu ish bajarilgan vaqtga nisbatiga teng. Belgisi: N (yoki P).</p>`,'b'],
[`Quvvat formulasi`,`<p><b>N = A / t</b>, bu yerda A — bajarilgan ish (J), t — vaqt (s), N — quvvat (W).</p>`,'c'],
[`Quvvat birligi`,`<p>Quvvat birligi — <b>vatt (W)</b>: 1 W = 1 J / 1 s. Katta birliklar: 1 kW = 1000 W, 1 MW = 1 000 000 W. Quvvat birligi ingliz olimi Jeyms Vatt nomi bilan atalgan.</p>`,'d'],
[`Vattning ma'nosi`,`<p>1 W — 1 sekundda 1 J ish bajaradigan qurilma quvvati. 60 W lampochka har sekundda 60 J elektr energiyasini yorug'lik va issiqlikka aylantiradi.</p>`,'e'],
[`Ish va vaqtni topish`,`<p>Formuladan: <b>A = N · t</b> (ishni topish) va <b>t = A / N</b> (vaqtni topish). Birliklar: N — vatt, t — sekund, A — joul.</p>`,'f'],
[`Vaqtni hisoblash misoli`,`<p>Quvvati 200 W bo'lgan mashina 1000 J ish bajarishi uchun t = A/N = 1000/200 = <b>5 s</b> vaqt kerak.</p>`,'g'],
[`Quvvat va tezlik`,`<p>Jism F kuch ta'sirida v tezlik bilan tekis harakatlansa, quvvat <b>N = F · v</b>. Bu A = F·s va v = s/t dan kelib chiqadi. Avtomobil bir xil quvvatda tezlikni oshirsa, tortish kuchi kamayadi.</p>`,'h'],
[`Turli qurilmalar quvvati`,`<p>Odam uzoq vaqt davomida o'rtacha 70–100 W quvvat sarflaydi. Lampochka — 60 W, choynak — 2 kW, avtomobil dvigateli — taxminan 70 kW, elektrovoz — bir necha MW.</p>`,'i'],
[`Ot kuchi`,`<p>Texnikada <b>ot kuchi (o.k.)</b> birligi ham ishlatiladi: 1 o.k. ≈ 735,5 W. Demak, 1 kW ≈ 1,36 o.k.</p>`,'j'],
[`Energiya sarfi`,`<p>Sarflangan energiya E = N · t. Kundalik hayotda <b>kilovatt-soat</b> ishlatiladi: 1 kW·soat = 1000 W · 3600 s = 3 600 000 J = 3,6 MJ.</p>`,'k'],
[`Mashinalar quvvati`,`<p>Kran, motor, nasos kabi mexanizmlarning quvvati ularning qanchalik tez ish bajarishini ko'rsatadi. Quvvati katta mexanizm bir xil ishni kam vaqtda bajaradi.</p>`,'l'],
[`Masala 1`,`<p>Massasi 50 kg yuk 4 m balandlikka 10 s da ko'tarildi. Ish A = m·g·h = 50·9,8·4 = 1960 J. Quvvat N = A/t = 1960/10 = <b>196 W</b>.</p>`,'m'],
[`Masala 2`,`<p>Kran 2000 N og'irlikdagi yukni 12 m balandlikka 20 s da ko'tardi. A = F·s = 24 000 J; N = A/t = 24 000/20 = <b>1200 W = 1,2 kW</b>.</p>`,'n'],
[`Xulosa`,`<p>N = A/t; A = N·t; N = F·v. Birlik — vatt: 1 W = 1 J/s, 1 kW = 1000 W. Quvvat katta bo'lsa, ish tezroq bajariladi. Energiya sarfi kW·soat da hisoblanadi.</p>`,'o']];
let si=0;
function rs(){const s=S[si];$('#sl').innerHTML=`<h2>${si+1}. ${s[0]}</h2><div>${s[1]}</div><div class="fig">${FIG[s[2]]()}</div>`;$('#spg').textContent=(si+1)+' / '+S.length;[...$('#dots').children].forEach((d,i)=>d.classList.toggle('pr',i==si));if(si==S.length-1)add('sl',10)}
function go(d){si=Math.max(0,Math.min(S.length-1,si+d));rs()}
S.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>{si=i;rs()};$('#dots').append(b)});
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(cur==0){if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)}});
let tx=0;$('#s0').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#s0').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?1:-1)});
/* Canvas */
function ar(x,a,b,c,d,k){x.strokeStyle=x.fillStyle=k;x.lineWidth=5;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();const g=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-14*Math.cos(g-.4),d-14*Math.sin(g-.4));x.lineTo(c-14*Math.cos(g+.4),d-14*Math.sin(g+.4));x.fill()}
/* SIM */
const S3={x:0,w:0},S4={e:0};
const SM=[
{n:`N = A/t`,c:[[`Ish A (J)`,100,2000,800,50],[`Vaqt t (s)`,1,20,4,1]],d(x,t,[A,tt],c){const N=A/tt,u=Math.min(1,(t%(tt+1.2))/tt),ly=250-u*170;x.fillStyle='#555';x.fillRect(60,280,120,14);x.fillStyle='#d9a21c';x.fillRect(100,60,12,220);x.fillRect(100,60,200,12);x.strokeStyle=c;x.lineWidth=2;x.beginPath();x.moveTo(290,72);x.lineTo(290,ly);x.stroke();x.fillStyle='#0b78d1';x.fillRect(270,ly,40,30);x.fillStyle='#889';x.fillRect(250,293,100,6);x.strokeStyle=c;x.strokeRect(480,40,40,220);x.fillStyle='#1b9e55';const h=N/2000*220;x.fillRect(480,260-h,40,h);x.fillStyle=c;x.fillText(`N = ${N.toFixed(0)} W`,450,285);x.fillText('Quvvat',470,30);x.fillText(`t: ${(u*tt).toFixed(1)} s`,20,30);return `N = A/t = ${A} / ${tt} = ${N.toFixed(1)} W: ${A} J ish ${tt} s da bajariladi`}},

<script id="EMAKTAB_SUPABASE_INJECTION" type="text/javascript">

<script>
(function() {
  if (window.__EMAKTAB_LESSON_INJECTED__) return;
  window.__EMAKTAB_LESSON_INJECTED__ = true;

  function getStudent() {
    try {
      const raw = localStorage.getItem('emaktab_student');
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      return null;
    }
  }

  function findLessonTitle() {
    const direct = document.querySelector('h1, h2, .lesson-title, .topic-title');
    return (direct && direct.textContent && direct.textContent.trim()) || document.title || 'Fizika darsi';
  }

  window.__EMAKTAB_SUBMIT_TEST_RESULT__ = async function(payload) {
    const student = getStudent();
    if (!student) {
      const evt = new CustomEvent('emaktab:student-required');
      window.dispatchEvent(evt);
      return { ok: false, reason: 'no_student' };
    }
    const record = {
      student_id: student.id || null,
      student_name: [student.first_name, student.last_name].filter(Boolean).join(' '),
      phone: student.phone || '',
      grade: student.grade || '7-sinf',
      subject: 'Fizika',
      lesson_title: payload.lesson_title || findLessonTitle(),
      score: Number(payload.score || 0),
      total_questions: Number(payload.total_questions || 0),
      created_at: new Date().toISOString()
    };

    if (!window.supabase) return { ok: true, queued: true, data: record };

    try {
      const { data, error } = await window.supabase.from('test_results').insert([record]).select();
      if (error) throw error;
      return { ok: true, data: data || record };
    } catch (error) {
      console.error('Supabase lesson result send failed:', error);
      return { ok: false, error: String(error) };
    }
  };
})();
<\/script>
